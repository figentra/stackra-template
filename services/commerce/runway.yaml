# yaml-language-server: $schema=../../schemas/runway-service.schema.json
# Stackra file contract:
# Purpose: WHAT the commerce member needs per environment beyond what gen derives from
#          stackra.manifest.json: the secret names it reads, the sizes of its own stores (database,
#          cache keyspace, buckets, queues), whether crons run, health thresholds, and the config
#          values that set its config classes, driver choices included. The member is the folder
#          that holds this file, so the file does not name it.
# Boundary: never WHERE it runs or how it is packed: deployables, groups, `isolate`, cpu, memory,
#           instances and worker splits are the root runway's topology. No secret value (Stackra
#           ADR 0173), no business value (src/config/*, settings). Every resource here is shared:
#           commerce needs no dedicated cache or search engine, so there is no `requires` block.
#           Health checks are declared in stackra.config.ts; this file tunes only their thresholds
#           (Stackra ADR 0190). Driver choices are config fields typed `DriverName<Port>`, so they
#           sit under `config` like every other value.
# Runtime: node
# Governing contract: Stackra ADR 0296 (member runway), ADR 0168 (as amended), ADR 0173, ADR 0190,
#                     ADR 0238 (one logical database per service), ADR 0294 (config keys)
$schema: "@stackra/runway/schema/service.json"
version: 3

# Every @Secret of src/config/*; gen fails on a missing one. Names only.
secrets: [PRICING_API_KEY]

# Thresholds only; the path and the checks are stackra.config.ts `health`.
health:
  readiness:
    requireMigrations: true
    timeoutSeconds: 2
  liveness:
    eventLoopLagMs: 1000

environments:
  dev:
    # the service's own listener when run standalone; under `encore run` the gateway fronts it
    port: 4001
    # one logical database `commerce` per lane, one Postgres schema per module inside it
    database:
      extensions: [ltree, pg_trgm]
    # `encore run` does not run crons; the dev console triggers them
    crons:
      enabled: false
    # the last config layer: per-environment values, keyed by config key, over the root runway's
    # `defaults.service.config` (the queue, cache, events, workflow, realtime, notifications and
    # media drivers come from there)
    config:
      commerce:
        # the web member's dev origin, resolved by gen; no literal port (Stackra ADR 0170)
        storefrontBaseUrl:
          from-member: web
      # the in-memory index, so a fresh clone searches without building the Postgres index
      search:
        driver: memory
      loyalty_kit:
        ledger: memory
      access_log:
        sink: memory

  preview:
    database:
      plan: shared
    # previews never mail a real address: the root defaults pick the memory notifications driver
    config:
      commerce:
        storefrontBaseUrl: "https://web-pr-${pr}.preview.acme.example"

  staging:
    database:
      storageGb: 20
      extensions: [ltree, pg_trgm]
      # connections this member may hold on the shared server
      poolBudget: 20
    # a keyspace on the shared cache cluster
    cache:
      keyspaceMb: 256
    # sizes of the buckets the manifest lists
    buckets:
      product_images:
        storageGb: 5
    # queue names come from the manifest (job queues, listeners, notifications); sizes here
    queues:
      default:
        visibilityTimeoutSeconds: 300
        dlq: true
      maintenance:
        visibilityTimeoutSeconds: 180
        dlq: true
      notifications:
        visibilityTimeoutSeconds: 120
        dlq: true
    crons:
      enabled: true
    config:
      commerce:
        storefrontBaseUrl: https://staging.acme.example

  production:
    database:
      storageGb: 100
      extensions: [ltree, pg_trgm]
      readReplica: false
      poolBudget: 50
    cache:
      keyspaceMb: 1024
    buckets:
      product_images:
        storageGb: 50
    queues:
      default:
        visibilityTimeoutSeconds: 300
        dlq: true
      maintenance:
        visibilityTimeoutSeconds: 180
        dlq: true
      notifications:
        visibilityTimeoutSeconds: 120
        dlq: true
    crons:
      enabled: true
    config:
      commerce:
        storefrontBaseUrl: https://www.acme.example
