# yaml-language-server: $schema=./schemas/runway-root.schema.json
# Stackra file contract:
# Purpose: the ROOT runway: WHERE things run and HOW they are packed. Providers and accounts,
#          destinations per environment (AWS account and region, Encore Cloud app, Docker host,
#          Cloudflare zone, EAS project), the pools many members share (the one Postgres server per
#          environment, the cache cluster, the queue provider, networking), domains, the edge, the
#          release policy, the DEFAULTS members inherit, and each environment's TOPOLOGY: whether
#          the service members run as one process (`monolith`), in named groups (`grouped`) or one
#          process each (`split`), which members keep their own database server (`isolate`), and
#          the members, size and worker split of every group.
# Boundary: no member fact (a member's port, domains, store sizes, secret names, config values and
#           the dedicated resources it `requires` are its own runway.yaml), no single-owner
#           dependency (the identity provider belongs to the identity member; Valkey, object
#           storage, mail capture and antivirus containers are declared by the driver packages that
#           need them and start only when a member selects that driver), no package behaviour
#           (src/config) and no secret value (Stackra ADR 0173). `ref:<path>` resolves from the
#           private stacks repository's Pulumi stack config at infra and deploy time (Stackra ADR
#           0171); a private product repository may inline the id. Read by `stackra infra`, `stackra
#           gen` (Encore process allocation, compose, wrangler, eas.json), `stackra dev` and the
#           runway workflows; validated by `@stackra/runway/schema/root.json` in `stackra validate`,
#           which fails when a grouped environment does not place every service member in exactly
#           one group. `defaults.service.config` is the config layer every service member starts
#           from in that environment, keyed by config key: the driver choices
#           (`notifications.driver` is `memory` in dev and preview and `notifications` in staging
#           and production; `search.driver`, `media.disk` and `webhooks.driver` are the defaults of
#           the `@stackra/search`, `@stackra/media` and `@stackra/webhooks` ports). A member
#           runway's `config` overrides one key per environment.
# Runtime: node
# Governing contract: Stackra ADR 0296 (root topology groups and defaults), Stackra ADR 0168 and
#                     0169 (as amended by 0296), 0170, 0171, 0173, 0175, 0179, 0180, 0184, 0238,
#                     0254
$schema: "@stackra/runway/schema/root.json"
version: 3
# Prefix for stacks (`acme-platform/staging`), images (`acme-platform-core`), Workers and tags.
project: acme-platform

# ── Providers: every account and vendor, named once ───────────────────────────────────────────────
providers:
  aws:
    # One region (Stackra ADR 0186); a tenant's region is immutable (Stackra ADR 0210).
    region: me-central-1
    # Three accounts: `shared` holds the state bucket and the image registry, `nonprod` runs preview
    # and staging, `prod` runs production (Stackra ADR 0171).
    accounts:
      shared: ref:aws.accounts.shared
      nonprod: ref:aws.accounts.nonprod
      prod: ref:aws.accounts.prod
    # Pulumi state: an S3 bucket encrypted with a KMS key (Stackra ADR 0171).
    state:
      bucket: ref:aws.state.bucket
      kmsKey: ref:aws.state.kmsKey
    # The image registry: every image is scanned, gets an SBOM and is signed before a deploy reads it
    # (Stackra ADR 0019).
    ecr:
      account: shared
      scan: trivy
      sbom: syft
      sign: cosign
    # Cost alerts at these percentages of the monthly budget; non-production stops at 100%.
    budgets:
      thresholds: [50, 80, 100]
      stopNonProdAt: 100
    # Tags every resource carries, for cost allocation and access policies.
    requiredTags: [env, service, tenant]
  encore:
    # Encore Cloud app id (public, not a secret).
    app: acme-platform
  cloudflare:
    accountId: ref:cloudflare.accountId
    # Zone → zone id; member runways name hosts under these zones. `acme.example` is a reserved
    # example domain: put your own zone here.
    zones:
      acme.example: ref:cloudflare.zones.acme
  # The repository and its deployment environments (Stackra ADR 0170).
  github:
    org: acme
    repo: acme-platform
    environments:
      production:
        # A production promotion waits for one of these reviewers (a team or a user).
        reviewers: [acme/platform-team]
  infisical:
    # Infisical Cloud, EU region (Stackra ADR 0171).
    domain: https://eu.infisical.com
    workspace: ref:infisical.workspace
    # Runway environment → Infisical environment.
    environments:
      dev: dev
      preview: preview
      staging: staging
      production: prod
    # Default secret paths; a member may name `path: ci`.
    paths:
      runtime: /runtime
      ci: /ci
      agents: /agents
  sentry:
    # Projects are named per member (app runway `telemetry.sentryProject`).
    org: acme
  betterstack:
    source: ref:betterstack.source
  # The collector every service exports to (Stackra ADR 0184); on-premises it is the bundled
  # otel-lgtm container.
  otlp:
    endpoint: ref:otlp.endpoint
  # The EAS project the mobile app builds and updates under (Stackra ADR 0180).
  expo:
    account: acme
    projectId: ref:expo.projectId
  # The Apple developer team that signs the iOS app, and the App Store Connect app record the
  # submit profiles in the mobile member's eas.json upload to (Stackra ADR 0180).
  apple:
    teamId: ref:apple.teamId
    ascAppId: ref:apple.ascAppId
  google:
    playDeveloperId: ref:google.playDeveloperId
  # Licence keys and distribution of paid packages (Stackra ADR 0177).
  keygen:
    account: ref:keygen.account

# ── Environments: exactly these four names in every tool (Stackra ADR 0170; `local` is `dev`) ─────
environments:
  dev:
    # Where each kind of member runs; a member runway may override its own destination.
    destinations:
      # `stackra dev` = gen --watch + `encore run` + the compose infra below.
      services: compose
      # Apps with web, PWA or desktop targets run their own dev server on the member's port.
      web: vite-dev
      # Metro on the member's port.
      mobile: expo-dev
    # The shared containers `stackra dev` brings. A driver's own container (Valkey, object storage,
    # mail capture, antivirus) comes from the package that ships the driver and starts only when a
    # member selects it; the identity provider comes with the identity member.
    infra:
      # `encore run`: every service behind one port, and the Encore dev dashboard.
      gateway:
        port: 4000
        dashboard: 9400
      # The one Postgres server; each service gets its own logical database (Stackra ADR 0238).
      # The pgvector image is Postgres 17 with pgvector built in; ltree and pg_trgm ship with
      # Postgres.
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie@sha256:7a7e9f22015b67edb4bef5c59daeebcd7e74bfa570df6ce60ae01237c8648a84
        port: 5432
        extensions: [pgvector, ltree, pg_trgm]
        perLane: true
      # Traces, metrics and logs in one local container (Grafana, Tempo, Loki, Prometheus), started
      # on request.
      otel-lgtm:
        image: grafana/otel-lgtm:0.37.0@sha256:57b5ab1ca6619beb180174e2fccce04762470750669d043f544b4726d0582d07
        grpcPort: 4317
        httpPort: 4318
        uiPort: 3000
        when: opt-in
    # Worktree N adds N*100 to every dev port (member and infra), so worktrees run side by side.
    lanes:
      enabled: true
      portStep: 100
      from: STACKRA_LANE
    # On: a local certificate authority, `<key>.localhost` names and one proxy.
    https:
      enabled: false
      tool: mkcert
      hosts: "*.localhost"
    # Routes by Host to member dev ports; needed only for *.localhost or https.
    proxy:
      enabled: false
      port: 4443
    # `encore run` serves every service member from one process; nothing is sized here.
    topology:
      mode: monolith
    defaults:
      service:
        # The config layer every service member starts from in dev; a member runway overrides a
        # key. Memory drivers keep a fresh clone free of containers beyond the ones above.
        config:
          queue:
            driver: memory
          cache:
            driver: memory
          events:
            driver: memory
          workflow:
            driver: native
          realtime:
            driver: memory
          scheduler:
            driver: croner
          filesystem:
            disk: local
          notifications:
            driver: memory
          search:
            driver: postgres
          media:
            disk: memory
          webhooks:
            driver: memory
      app:
        https: false
        open: false

  # Optional per-pull-request environments; delete the block if you do not use them.
  preview:
    destinations:
      services: encore-cloud
      web: cloudflare-workers
      mobile: eas
    # One Encore environment per pull request.
    encore:
      env: "preview-${pr}"
    ttl: 7d
    # Synthetic data only: the golden tenant the seeders publish.
    data: synthetic
    shared:
      # One small server for every preview; one logical database per service (Stackra ADR 0238).
      database:
        plan: shared
        class: db.t4g.small
      cache:
        engine: none
      queues:
        provider: sns-sqs
    # One small process for every service member of a preview; a new member lands in `core`
    # without a line here.
    topology:
      mode: grouped
      default: core
      groups:
        core:
          members: [commerce, notifications]
          cpu: 0.25
          memory: 512Mi
          instances:
            min: 1
            max: 1
    defaults:
      service:
        config:
          queue:
            driver: encore-pubsub
          cache:
            driver: memory
          events:
            driver: encore-pubsub
          workflow:
            driver: native
          realtime:
            driver: sse
          filesystem:
            disk: s3
          # previews never mail a real address
          notifications:
            driver: memory
          search:
            driver: postgres
          media:
            disk: s3
          webhooks:
            driver: native
    # Members get `<key>-pr-N.preview.acme.example` unless they say otherwise.
    domains:
      zone: acme.example
      pattern: "${member}-pr-${pr}.preview"
    # A preview deploys on every pull request and gates on the health endpoint only.
    deploy:
      on: pull-request
      gate: health

  staging:
    destinations:
      services: encore-cloud
      web: cloudflare-workers
      mobile: eas
      desktop: electron-release
    # Encore Cloud process allocation = the groups of `topology` below.
    encore:
      env: staging
      account: nonprod
      processAllocation: from-topology
    shared:
      # Used by aws-ecs, and by Encore Cloud's own VPC settings where it accepts them.
      network:
        vpc:
          cidr: 10.40.0.0/16
          azs: 2
          natGateways: 1
        loadBalancer:
          type: alb
          idleTimeoutSeconds: 60
      # ONE server per environment (Stackra ADR 0238).
      database:
        engine: rds-postgres
        class: db.t4g.medium
        storageGb: 50
        multiAz: false
        extensions: [pgvector, ltree, pg_trgm]
        pool:
          proxy: rds-proxy
      cache:
        engine: valkey
        node: cache.t4g.small
        replicas: 0
      queues:
        provider: sns-sqs
        dlq: true
      # Defaults for every member bucket.
      buckets:
        versioning: true
        lifecycle:
          expireNoncurrentDays: 30
    # Both services share one process allocation; staging carries a fraction of production load.
    topology:
      mode: grouped
      default: core
      groups:
        core:
          members: [commerce, notifications]
          cpu: 0.5
          memory: 1Gi
          instances:
            min: 1
            max: 2
          scaling:
            metric: cpu
            target: 70
          workers:
            split: false
    defaults:
      service:
        # connections one member may hold on the shared server unless its runway says otherwise
        database:
          poolBudget: 20
        config:
          queue:
            driver: encore-pubsub
          cache:
            driver: valkey
          events:
            driver: encore-pubsub
          workflow:
            driver: native
          realtime:
            driver: sse
          filesystem:
            disk: s3
          notifications:
            driver: notifications
          search:
            driver: postgres
          media:
            disk: s3
          webhooks:
            driver: native
      app:
        workers:
          observability:
            headSamplingRate: 0.1
    domains:
      zone: acme.example
      pattern: "${member}.staging"
    # Staging deploys on every merge to main.
    deploy:
      on: merge-to-main
    # The EAS update channel members inherit.
    mobile:
      channel: staging
    desktop:
      channel: beta

  production:
    destinations:
      # Switch `services` to aws-ecs, helm or compose and the matching `targets.*` block applies.
      services: encore-cloud
      web: cloudflare-workers
      mobile: eas
      desktop: electron-release
    encore:
      env: production
      account: prod
      processAllocation: from-topology
    shared:
      network:
        vpc:
          cidr: 10.50.0.0/16
          azs: 3
          natGateways: 3
        loadBalancer:
          type: alb
          idleTimeoutSeconds: 60
      database:
        engine: rds-postgres
        class: db.r7g.large
        storageGb: 200
        multiAz: true
        backups:
          retentionDays: 35
          pitr: true
        extensions: [pgvector, ltree, pg_trgm]
        pool:
          proxy: rds-proxy
      cache:
        engine: valkey
        node: cache.r7g.large
        replicas: 1
      queues:
        provider: sns-sqs
        dlq: true
      buckets:
        versioning: true
    # Each service scales on its own. No `default`: a new service member fails `stackra validate`
    # until it is placed in a group here, so nothing reaches production unplaced.
    topology:
      mode: grouped
      # Members with their own database server and network policy. The platform's identity and
      # payments services run from their own repositories, whose root runways isolate them; no
      # member of this repository needs it.
      isolate: []
      groups:
        commerce:
          members: [commerce]
          cpu: 1
          memory: 2Gi
          instances:
            min: 2
            max: 10
          scaling:
            metric: cpu
            target: 60
          # queue consumers, crons and the outbox relay scale apart from request handling
          workers:
            split: true
            cpu: 0.5
            memory: 1Gi
            instances:
              min: 1
              max: 4
        notifications:
          members: [notifications]
          cpu: 0.5
          memory: 1Gi
          instances:
            min: 2
            max: 6
          scaling:
            metric: cpu
            target: 60
          workers:
            split: false
    defaults:
      service:
        database:
          poolBudget: 50
        config:
          queue:
            driver: encore-pubsub
          cache:
            driver: valkey
          events:
            driver: encore-pubsub
          workflow:
            driver: native
          realtime:
            driver: sse
          filesystem:
            disk: s3
          notifications:
            driver: notifications
          search:
            driver: postgres
          media:
            disk: s3
          webhooks:
            driver: native
    # Tenant custom domains go through Cloudflare for SaaS; on-premises installs use the customer's
    # certificates instead.
    domains:
      zone: acme.example
      pattern: "${member}"
      tenantDomains: cloudflare-for-saas
    # `runway promote <sha>` behind the production environment's reviewers (providers.github).
    deploy:
      on: promote
      approval: github-environment
    mobile:
      channel: production
    desktop:
      channel: latest

# ── Target blocks: provider shape, selected by `environments.<env>.destinations.*` ────────────────
targets:
  # Managed hosting; sizes come from `shared` and the groups of each environment's `topology`.
  encore-cloud:
    cloud: aws
  # Self-hosting on AWS (the @stackra-pro runtime stack, Stackra ADR 0171).
  aws-ecs:
    # fargate | ec2
    compute: fargate
    # In front of static apps that do not run on Workers.
    cloudfront:
      enabled: true
    images:
      arch: [amd64, arm64]
  # Single-host on-premises (Stackra ADR 0179) and dev.
  compose:
    # The shared containers every install runs; driver containers and the identity provider join
    # when a member selects that driver or the identity member is installed.
    bundled: [postgres, otel-lgtm]
    # Or the customer's registry, or `docker load` for an air-gapped install (Stackra ADR 0179).
    registry: ghcr.io/acme
  # Kubernetes on-premises; Zarf packages the air-gapped install (Stackra ADR 0179).
  helm:
    namespace: acme-platform
    ingressClass: nginx
    storageClass: default
    zarf: true
  cloudflare-workers:
    compatibilityDate: "2026-10-01"
    observability:
      headSamplingRate: 0.1
  eas:
    # A native build runs on a native fingerprint change, the `build:mobile` label or a release
    # (Stackra ADR 0180).
    buildTrigger: fingerprint
    # The monthly EAS build budget (Stackra ADR 0180).
    monthlyBuildCap: 60
    # Signing certificates live in EAS, never in the repository.
    credentials: eas-managed
    # Which CI secrets the submit step reads.
    submit:
      ios: app-store-connect-api-key
      android: service-account
    # OTA (expo-updates): the channel is `environments.<env>.mobile.channel`; the runtime version is
    # the member's `stackra.config.ts` `expo.runtimeVersion` (the fingerprint policy), so an update
    # never reaches a binary whose native layer differs. A staged rollout widens by `stepHours`
    # unless the crash-rate gate trips.
    ota:
      rollout:
        startPercent: 10
        endPercent: 100
        stepHours: 24
      gate:
        crashFreeSessions: 99.5
      rollback: republish-previous
    # A production store release (Play) opens at this percentage of users; the crash-rate gate
    # above widens it, as for OTA updates (Stackra ADR 0180).
    storeRollout:
      startPercent: 10
    # The server-side minimum-version gate: the gateway refuses a mobile binary older than the last
    # `supportedStoreVersions` store releases, and the app asks the user to update (Stackra ADR
    # 0180). A release policy, the same for every mobile member, so it is not a member fact.
    minimumVersion:
      gate: true
      supportedStoreVersions: 2
  electron-release:
    # Members append `/<key>/<channel>/`.
    feed:
      bucket: r2:acme-downloads
      publicOrigin: https://downloads.acme.example
    # A staged rollout widens by `stepHours` (Stackra ADR 0254).
    rollout:
      startPercent: 20
      endPercent: 100
      stepHours: 24
    # Tooling only; ON or OFF is the member's `release.desktop.signing`.
    signing:
      mac: notarize
      windows: azure-trusted-signing
      linux: none
    # Runner images of the desktop release jobs, pinned so a runner upgrade is a reviewed change.
    runners:
      mac: macos-15
      windows: windows-2025
      linux: ubuntu-24.04

# ── Edge (Stackra ADR 0175, 0237 layer 1) ─────────────────────────────────────────────────────────
edge:
  # Cloudflare proxies every public hostname.
  proxy: all
  waf: managed
  bots:
    mode: likely-automated-challenge
  # Coarse per-IP limit; per-area limits are rate-limit.config.ts.
  rateLimit:
    perIp:
      requests: 600
      periodSeconds: 60
  tls:
    minVersion: "1.2"
    hsts: true
  # `api.<zone>/{public,app,admin,platform}` routes to the Encore gateway (Stackra ADR 0237).
  apiHost: api
  # Reverse-proxy path for PostHog on app origins.
  analyticsProxy: /ingest

# ── Secrets: vault defaults; NAMES are declared by members (Stackra ADR 0168, 0173, 0257) ──────────
secrets:
  # Runway syncs Infisical → Encore secrets, Worker secrets, EAS environments, compose env (outside
  # git) and Kubernetes Secrets.
  sync: on-deploy
  defaultPath: runtime
  # CI-only names the release workflows read over OIDC; never given to a runtime.
  ci:
    - EXPO_TOKEN
    - APPLE_ASC_KEY_ID
    - APPLE_ASC_ISSUER_ID
    - APPLE_ASC_KEY_P8
    - GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
    # The Firebase client config of the Android app (FCM push), synced to EAS as a file variable.
    - GOOGLE_SERVICES_JSON
    - APPLE_NOTARY_KEY_P8
    - APPLE_SIGNING_CERT_P12
    - APPLE_SIGNING_CERT_PASSWORD
    - AZURE_SIGNING_CLIENT_ID
    - AZURE_SIGNING_CLIENT_SECRET
    - CLOUDFLARE_API_TOKEN
    - SENTRY_AUTH_TOKEN
    - TURBO_TOKEN
    # Signs and verifies every remote-cache artefact (turbo.jsonc `remoteCache.signature`).
    - TURBO_REMOTE_CACHE_SIGNATURE_KEY
    - ENCORE_AUTH_KEY
  # Runtime names the generated API gateway reads (Stackra ADR 0237); the gateway belongs to no
  # member, so its names sit here. The web Worker signs the visitor address it forwards with the
  # same key, which apps/web/runway.yaml names too (Stackra ADR 0297 decision 6).
  gateway:
    - GATEWAY_VISITOR_SIGNING_KEY

# ── Release policy (Stackra ADR 0170) ─────────────────────────────────────────────────────────────
release:
  # SaaS promotes the commit SHA; on-premises bundles promote the image digest.
  promote:
    unit: sha
  # Post-deploy gates: the health endpoint reports the deployed SHA, the Playwright smoke suite
  # passes, and errors are watched for 15 minutes.
  gate:
    health: sha
    smoke: playwright
    errorWatchMinutes: 15
  strategy:
    kind: all-at-once
    healthGate: true
    autoRollback: true
  # The rollback window after a promotion, and who triggers a rollback.
  rollback:
    withinMinutes: 15
    by: owner
  # Where every release is recorded.
  records: [github-deployments, linear-release, "slack:#deploys"]
  # Build and publish order across destinations.
  buildOrder: [npm, cloudflare-workers, encore-cloud, eas, aws-ecs, compose, helm]
  # On-premises upgrades (Stackra ADR 0179).
  onPrem:
    upgrades: sequential-minor
    preflight: true
    backup: mandatory
    migrationsAsJob: true

# ── Observability defaults (Stackra ADR 0184) ─────────────────────────────────────────────────────
observability:
  # Hot logs are searchable for 30 days, then archived to object storage for 13 months.
  logs:
    hotDays: 30
    coldMonths: 13
    coldStore: s3
  # Every cron, outbox relay and worker reports a heartbeat; a missed one alerts.
  heartbeats:
    crons: true
    relays: true
    workers: true
  # Service-level objectives start with the first paying tenant.
  slos:
    startAt: first-paying-tenant
