#:schema https://mise.jdx.dev/schema/mise.json
# Stackra file contract:
# Purpose: pins the toolchain every contributor and CI job runs; `pnpm` here matches `packageManager` in
#          package.json (corepack reads that one).
# Boundary: tool versions and one non-secret environment default only; no secret.
# Runtime: node
# Governing contract: ADR 0027 (CLI tools pinned in mise.toml)
[tools]
node = "24.22.0"
pnpm = "12.6.0"
gitleaks = "8.30.1"
# Developer-machine CLIs no mise backend carries: encore, and the assistant you use (claude, opencode).
# Infisical is the default secret store (ADR 0173); maestro also needs a JDK on PATH.
"github:Infisical/cli" = "0.44.2"
"github:mobile-dev-inc/maestro" = "cli-2.10.0"

[env]
NODE_ENV = "development"
