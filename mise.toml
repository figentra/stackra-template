#:schema https://mise.jdx.dev/schema/mise.json
# Stackra file contract:
# Purpose: pins the toolchain every contributor and CI job runs, at exact versions. `pnpm` here matches
#          `packageManager` in package.json (corepack reads that one) and `node` matches .node-version.
# Boundary: tool versions only; no environment variable and no secret. NODE_ENV is never set here:
#           mise-action exports [env] into every CI step, and a build that sees
#           NODE_ENV=development ships development bundles.
# Runtime: node
# Governing contract: Stackra ADR 0027 (CLI tools pinned in mise.toml)
[tools]
# The JavaScript runtime for every member, script and hook.
node = "24.22.0"
# The package manager; the same version as `packageManager` in package.json.
pnpm = "12.16.1"
# The commit hooks' formatter, linter and spell checker, so lefthook runs them without a workspace install. Same
# versions as the catalog in pnpm-workspace.yaml; `stackra check`'s tool-pins finding keeps the two in step.
"npm:oxfmt" = "0.71.0"
"npm:oxlint" = "1.86.0"
"npm:cspell" = "10.4.0"
# Secret scanner for the pre-commit hook and the CI gate (.gitleaks.toml).
gitleaks = "8.30.1"
# Known vulnerabilities in pnpm-lock.yaml, in the Quality Gate (ADR 0174).
"aqua:google/osv-scanner" = "2.7.0"
# Maestro, the mobile end-to-end runner; it also needs a JDK on PATH.
"github:mobile-dev-inc/maestro" = "cli-2.10.0"
# Encore CLI behind `stackra dev` and the Encore MCP server. Its GitHub releases carry no binaries,
# so the aqua backend (which downloads from Encore's own release host) installs it.
"aqua:encoredev/encore" = "1.58.8"
# EAS CLI for mobile builds, submissions and over-the-air updates.
"npm:eas-cli" = "25.3.0"
