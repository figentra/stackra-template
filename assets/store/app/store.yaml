# Stackra file contract:
# Purpose: the app-level store facts of the `app` mobile app (root runway.yaml `mobile.app`): urls, the
#          review contact and notes, the review demo account with its seed and probe, TestFlight groups
#          and app groups. The per-locale listing text sits in the locale folders beside it; identity
#          and capabilities come from the runway entry.
# Boundary: secret NAMES only, never a value: every `*Secret` field names a key in Infisical
#           (prod:/ci/store) that the store tooling reads at release time. Placeholders for the
#           example product: replace the urls and names with the product's own.
# Runtime: node
# Governing contract: Stackra ADR 0441 (decision 1), ADR 0480 (store presence as data)
# The App Store Connect app id, a number shown in App Store Connect once the app record exists; the
# release tooling writes it into eas.json before EAS submit and refuses to submit without it.
# ascAppId: "1234567890"
urls:
  # Both are required: the store tooling refuses a listing without them.
  privacyPolicy: https://acme.example/privacy
  support: https://acme.example/support
  marketing: https://acme.example
review:
  contact:
    firstName: Acme
    lastName: Review
    emailSecret: STORE_REVIEW_CONTACT_EMAIL
    phoneSecret: STORE_REVIEW_CONTACT_PHONE
  notes: Sign in with the demo account; the seed fills it with sample data before each review.
  # The account App Review signs in with.
  demoAccount:
    usernameSecret: STORE_REVIEW_DEMO_USERNAME
    passwordSecret: STORE_REVIEW_DEMO_PASSWORD
  # Resets the demo account's data before a submission (optional).
  seed:
    url: https://api.acme.example/ops/seed-demo
    tokenSecret: STORE_REVIEW_SEED_TOKEN
    body:
      mode: review
  # Proves the demo account signs in and sees data against production before a submission.
  probe:
    signIn:
      url: https://api.acme.example/auth/sign-in
      tokenField: token
    data:
      url: https://api.acme.example/me/dashboard
# The bundle id's App Store Connect capabilities come from the runway entry's `capabilities`.
usesNonExemptEncryption: false
# App group ids are created once in the Apple Developer portal (no public API); listed for the checklist.
appGroups: []
testflight:
  groups: [Internal]
