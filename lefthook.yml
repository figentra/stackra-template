# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/v2.2.2/schema.json
# Stackra file contract:
# Purpose: git hooks: pre-commit format and lint on staged files plus a secret scan, commit-msg conventional
#          commits, pre-push the committed contracts check and the affected gate. Installed by `pnpm install`
#          (prepare runs `lefthook install`).
# Boundary: advisory only; the CI Quality Gate (.github/workflows/ci.yml, `pnpm verify`) is the gate.
# Runtime: node
# Governing contract: ADR 0158 (committed manifests), ADR 0173 (secrets never in git)

pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      # every type oxfmt formats (CONTRIBUTING.md, "Formatting"); .oxfmtrc.jsonc ignores the rest
      glob:
        - "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
        - "*.{json,jsonc,json5,yaml,yml,toml,md,mdx}"
        - "*.{css,scss,less,html,graphql,vue}"
      # --check, not --write: stage_fixed would stash unstaged work. oxfmt exits 2 when every staged file is on
      # its ignore list (pnpm-lock.yaml alone): that is not a finding.
      run: sh -c 'pnpm exec oxfmt --check "$@"; s=$?; [ $s -eq 2 ] && exit 0; exit $s' -- {staged_files}
    - name: oxlint
      glob: "*.{ts,tsx,js,mjs,cjs}"
      run: pnpm exec oxlint {staged_files}
    - name: gitleaks
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --config .gitleaks.toml --no-banner --redact
        else
          echo "gitleaks not installed (mise install) — CI still scans"
        fi

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    # Committed .stackra/app-manifest.json and openapi.json equal what gen derives now.
    - name: gen-check
      run: pnpm exec stackra gen --check
    - name: verify-affected
      run: pnpm exec stackra verify --affected
