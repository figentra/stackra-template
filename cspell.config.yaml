# yaml-language-server: $schema=https://raw.githubusercontent.com/streetsidesoftware/cspell/v10.4.0/packages/cspell-types/cspell.schema.json
# Stackra file contract:
# Purpose: spelling for code and docs, enforced on staged files by lefthook and on the whole
#          repository by CI, and shown in the editor by Code Spell Checker. British English first
#          (the docs' spelling), US English accepted, plus the project's own words below.
# Boundary: dictionaries, ignores and project words only. A word goes here, never into a user's
#           settings; a file is ignored only when it is generated, vendored or not English.
# Runtime: node
# Governing contract: Stackra ADR 0300 decision 5 (enforced spell checking, British English with
#                     the en fallback), Stackra ADR 0007 (documentation standard)
version: "0.2"
# British English (en-GB) first, US English (en) accepted: code and third-party names use US spelling.
language: en-GB,en
# Files git ignores are never checked (node_modules, build output, local caches).
useGitignore: true
ignorePaths:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.turbo/**"
  - "**/coverage/**"
  - pnpm-lock.yaml
  # Generated by stackra gen; their sources are checked.
  - "**/.stackra/gen/**"
  # Generated by changesets.
  - "**/CHANGELOG.md"
  # Translations other than English, in source and in gen's copies.
  - "**/assets/lang/ar*/**"
  - "**/.stackra/lang/ar*/**"
  # Legal text kept verbatim.
  - "**/LICENSE"
  # Extension publisher ids, not words.
  - .vscode/extensions.json
ignoreRegExpList:
  # Arabic script appears outside the ar translations too (tests, overrides, samples).
  - "/[\\u0600-\\u06FF\\u0750-\\u077F]+/gu"
  # Base64 payloads: data URLs, and string literals that end in base64 padding.
  - "/data:[a-z]+\\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=]+/gi"
  - '/[A-Za-z0-9+/]{4,}={1,2}(?=["''`])/g'
  # Percent-encoded bytes in URLs and tests (`%2F`); the text around them is still checked.
  - "/%[0-9A-Fa-f]{2}/g"
  # Full commit SHAs and image digests.
  - "/\\b[0-9a-f]{40}\\b/g"
  - "/sha256:[0-9a-f]{64}/g"
