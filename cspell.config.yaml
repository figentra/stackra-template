# Spelling for code and docs (Code Spell Checker). Add project words here, not to user settings.
version: "0.2"
language: en,en-GB
# Arabic strings appear outside assets/lang/ar too (tests, overrides, generated samples).
ignoreRegExpList:
  - "/[\\u0600-\\u06FF]+/gu"
ignorePaths:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.turbo/**"
  - pnpm-lock.yaml
  - "**/assets/lang/ar/**"
  # publisher ids, not words
  - .vscode/extensions.json
words:
  - stackra
  - figentra
  - acme
  - oxfmt
  - oxlint
  - oxc
  - tsdown
  - turborepo
  - lefthook
