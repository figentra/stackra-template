# yaml-language-server: $schema=https://static.stackra.figentra.com/schemas/mcp.json
# Stackra file contract:
# Purpose: every MCP server this project uses, in one file. `stackra mcp sync` (run by `pnpm install`
#          through `prepare`) renders it into the gitignored .mcp.json that Claude Code reads; other
#          tools get their own format from the same source through `stackra agents setup`.
# Boundary: server definitions only, never a token. A server that needs a token runs through
#           `stackra mcp exec --`, which injects `$NAME` values from the project's secret store into
#           that one process. Remote (http) servers sign in with OAuth on first use (/mcp), and what
#           they may do is the scope granted at that sign-in: grant production read access only unless
#           a human approves writes. npx servers are pinned to exact versions (no @latest); bump them
#           as you would a catalog entry.
# Runtime: node
# Governing contract: Stackra ADR 0173 (secret values never in files), Stackra ADR 0282 (developer MCP)
mcpServers:
  # --------------------------------------------------------------------------------------------
  # 01. Stackra: this project's generated facts and the framework
  # --------------------------------------------------------------------------------------------
  # Local: manifests, routes, wiring, kinds; create members, run gen/validate/verify, call actions.
  stackra:
    command: pnpm
    args: [exec, stackra, mcp]
  # Hosted: Stackra docs, ADRs, the package registry and examples; project data after OAuth sign-in.
  stackra-cloud:
    type: http
    url: https://mcp.stackra.figentra.com/mcp

  # --------------------------------------------------------------------------------------------
  # 02. Runtime: the generated Encore app, locally and deployed
  # --------------------------------------------------------------------------------------------
  # Local: the running Encore app (`encore run`): traces, databases, endpoints. The app id is
  # runway.yaml `providers.encore.app`; the Encore CLI comes from mise.toml.
  encore:
    command: encore
    args: [mcp, run, --app=acme-platform]
  encore-cloud:
    type: http
    url: https://api.encore.dev/mcp

  # --------------------------------------------------------------------------------------------
  # 03. Library and framework documentation
  # --------------------------------------------------------------------------------------------
  context7:
    command: pnpm
    args:
      - exec
      - stackra
      - mcp
      - exec
      - --
      - npx
      - -y
      - "@upstash/context7-mcp@4.2.0"
      - --api-key
      - $CONTEXT7_API_KEY
  mintlify:
    type: http
    url: https://mintlify.com/docs/mcp

  # --------------------------------------------------------------------------------------------
  # 04. UI: HeroUI (web and native, open source and Pro), Uniwind, Expo, Figma
  # --------------------------------------------------------------------------------------------
  heroui-react:
    command: npx
    args: [-y, "@heroui/react-mcp@1.1.2"]
  heroui-native:
    command: npx
    args: [-y, "@heroui/native-mcp@1.1.2"]
  heroui-pro:
    command: pnpm
    args:
      - exec
      - stackra
      - mcp
      - exec
      - --
      - npx
      - -y
      - mcp-remote@0.14.3
      - https://mcp.heroui.pro/mcp
      - --header
      - x-heroui-personal-token:$HEROUI_PERSONAL_TOKEN
  heroui-native-pro:
    command: pnpm
    args:
      - exec
      - stackra
      - mcp
      - exec
      - --
      - npx
      - -y
      - mcp-remote@0.14.3
      - https://native-mcp.heroui.pro/mcp
      - --header
      - x-heroui-personal-token:$HEROUI_PERSONAL_TOKEN
  uniwind:
    type: http
    url: https://docs.uniwind.dev/mcp
  expo:
    type: http
    url: https://mcp.expo.dev/mcp
  figma:
    type: http
    url: https://mcp.figma.com/mcp

  # --------------------------------------------------------------------------------------------
  # 05. Source control and tracking
  # --------------------------------------------------------------------------------------------
  github:
    type: http
    url: https://api.githubcopilot.com/mcp/
  linear:
    type: http
    url: https://mcp.linear.app/mcp

  # --------------------------------------------------------------------------------------------
  # 06. Cloud and edge
  # --------------------------------------------------------------------------------------------
  cloudflare-docs:
    type: http
    url: https://docs.mcp.cloudflare.com/mcp
  cloudflare-api:
    type: http
    url: https://mcp.cloudflare.com/mcp
  # AWS documentation and regional availability only; no operations access.
  aws-knowledge:
    type: http
    url: https://knowledge-mcp.global.api.aws

  # --------------------------------------------------------------------------------------------
  # 07. Payments and email
  # --------------------------------------------------------------------------------------------
  stripe:
    type: http
    url: https://mcp.stripe.com
  resend-docs:
    type: http
    url: https://resend.com/docs/mcp

  # --------------------------------------------------------------------------------------------
  # 08. Errors, analytics and observability
  # --------------------------------------------------------------------------------------------
  # Issues, traces and releases; it can also update issues, within the scopes granted at sign-in.
  sentry:
    type: http
    url: https://mcp.sentry.dev/mcp
  # `readonly=true`: insights, flags and events can be read, never changed.
  posthog:
    type: http
    url: https://mcp.posthog.com/mcp?readonly=true

  # --------------------------------------------------------------------------------------------
  # 09. Browser automation and end-to-end checks
  # --------------------------------------------------------------------------------------------
  playwright:
    command: npx
    args: [-y, "@playwright/mcp@0.0.83"]
