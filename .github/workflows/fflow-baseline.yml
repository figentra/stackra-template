# Generated by fflow from the stackra preset 0.6.4: do not edit; change .flow/overrides/ and run `fflow sync`.
# Written by `fflow sync` from the config's `baseline` (STA-1942); `fflow gate ci` fails on a hand edit.
# One check, "Baseline": a pull request passes when it fails no task that passed on main.
name: fflow baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: fflow-baseline-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    name: Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      # for a setup step's OIDC login (registry auth through Infisical), as the repository's own CI has
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: "Toolchain (mise)"
        uses: "jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7"
        with:
          install_args: "node pnpm gitleaks aqua:google/osv-scanner"
      - name: "Registry auth"
        uses: "./.github/actions/registry-auth"
      - name: "Brand read token (GitHub App)"
        id: "brand-token"
        uses: "actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510"
        with:
          app-id: "${{ secrets.STACKRA_BOT_APP_ID }}"
          private-key: "${{ secrets.STACKRA_BOT_PRIVATE_KEY }}"
          owner: "figentra"
          repositories: "brand"
          permission-contents: "read"
        continue-on-error: true
      - name: "Checkout the brand CLI"
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
        with:
          repository: "figentra/brand"
          ref: "brand-figentra@1.0.3"
          path: ".figentra-brand"
          sparse-checkout: "cli"
          persist-credentials: false
          token: "${{ steps.brand-token.outputs.token }}"
        continue-on-error: true
      - name: "Pull brand"
        env:
          GITHUB_TOKEN: "${{ steps.brand-token.outputs.token }}"
        run: "node .figentra-brand/cli/bin/figentra-brand.mjs pull --out .brand"
        continue-on-error: true
      - name: Install
        run: pnpm install --frozen-lockfile
      # Failures are judged against main's baseline, so the run itself never fails the job.
      - name: Tasks
        run: pnpm exec turbo run lint typecheck build --continue --summarize || true
      - name: Results
        run: pnpm exec fflow gate baseline save
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fflow-baseline-${{ github.sha }}
          path: .fflow-gate/baseline.json
          retention-days: 90
      - if: github.event_name == 'pull_request'
        name: Compare with main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec fflow gate baseline check --base "$BASE_SHA"
