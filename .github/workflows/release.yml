# Stackra file contract:
# Purpose: release. With pending changesets it opens or updates the "version packages" PR; on that
#          PR's merge it publishes every package with "private": false to npm with provenance, then
#          uploads a CycloneDX SBOM. Apps and services deploy by commit SHA, not from here.
# Triggers: every push to main; workflow_dispatch with `dry_run` for a publish dry run.
# Needs: the `release` environment (protected, main only), contents and pull-requests write, and
#        id-token write for npm trusted publishing. No npm token and no repository secret.
# Skips: until the repository commits pnpm-lock.yaml (`preflight` below), every job is skipped and
#        the run is green: `pnpm install --frozen-lockfile` cannot run without a lockfile, which is
#        the case in the template while `@stackra/*` is unpublished (pre-release).
# Owner: the repository maintainers (CODEOWNERS). Runbook:
#        https://docs.stackra.figentra.com/runbooks/release
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run `pnpm -r publish --dry-run` (no version PR, no publish) in the release environment"
        type: boolean
        default: false

# One release run per ref at a time: a second run starting before this one finishes
# would version the same changesets twice.
concurrency: release-${{ github.ref }}

# ADR 0019 D2: nothing by default; the job below asks for what it needs.
permissions: {}

jobs:
  # Decides whether a release can run at all. hashFiles() is not available in a job-level `if`, so
  # this job checks out the lockfile alone and exposes the answer as an output the jobs below read.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-lockfile: ${{ steps.lockfile.outputs.present }}
    steps:
      # ADR 0019 D1: every action is pinned to a full commit SHA, the version in the trailing comment.
      - name: Checkout (lockfile only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - name: Lockfile present
        id: lockfile
        run: |
          present=false
          if [ -f pnpm-lock.yaml ]; then present=true; fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
          if [ "$present" = false ]; then
            echo "::notice::No pnpm-lock.yaml committed yet; release and SBOM are skipped."
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: preflight
    # No lockfile, no install: skip instead of failing (see the header).
    if: needs.preflight.outputs.has-lockfile == 'true'
    # https://docs.stackra.figentra.com/runbooks/release ("Before the first release"): a human
    # configures this environment as protected and restricted to main, so a branch that
    # edits the workflow cannot obtain a credential.
    environment: release
    permissions:
      contents: write # push the version-PR branch and the version tags
      pull-requests: write # open and update the version PR
      id-token: write # ADR 0177 amendment: pnpm trusted publishing (GitHub OIDC) and the provenance statement; no npm token

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # changesets diffs against history and reads existing tags
          submodules: false

      # ADR 0027 D2: node and pnpm come from mise.toml.
      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # With pending changesets this opens or updates the "version packages" PR; on its merge `changeset publish`
      # publishes every package with "private": false to npm with provenance. Apps and services deploy by commit SHA.
      - name: Build
        run: pnpm build

      - name: Publish dry run
        if: inputs.dry_run == true
        run: pnpm -r publish --dry-run --no-git-checks

      - name: Version PR / publish
        if: inputs.dry_run != true
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          # GITHUB_TOKEN works, but a PR it opens does not trigger the Quality Gate. Swap in a GitHub App token
          # (actions/create-github-app-token) when you want the version PR checked (README, "Make it yours").
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # changesets runs pnpm 12's native publish (`pnpm changeset publish` -> `pnpm publish`): it resolves
          # workspace:/catalog: versions and does the OIDC exchange and provenance itself, not the npm CLI.
          # No NPM_TOKEN exists anywhere (ADR 0177 amendment).
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_PROVENANCE: "true"

  # The SBOM job holds no id-token and no write permission: it only reads the repository.
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    # Runs only after a release job that ran; a skipped release skips this job too.
    needs: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: false

      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SBOM covers what actually got installed (node_modules), independent of whether this
      # run released. `--ignore-npm-errors` is required because cyclonedx-npm shells out to
      # `npm ls` internally, which reports the devDependency-only peer graphs of transitive
      # tools as errors even though pnpm installed fine. The tool is pinned via npx because
      # it is not a workspace catalog dependency.
      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --ignore-npm-errors --output-format JSON --output-file sbom.cdx.json

      - name: Upload SBOM as release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
