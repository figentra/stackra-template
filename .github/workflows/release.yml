# Stackra file contract:
# Purpose: release. With pending changesets it opens or updates the "version packages" pull request;
#          when that pull request merges it publishes every package that is not marked
#          `"private": true` to the Stackra registry (npm.stackra.figentra.com, ADR 0453) with
#          provenance, then builds a CycloneDX SBOM of the released tree. Apps and services deploy
#          by commit SHA, not from here.
# Boundary: triggers are every push to main and workflow_dispatch with `dry_run` for a publish dry
#           run. Needs the `release` environment (protected, main only), contents and pull-requests
#           write, and id-token write for the registry's OIDC exchange; no registry token and no
#           repository secret. Never publishes to npmjs. Until the repository commits
#           pnpm-lock.yaml (`preflight` below) every job is skipped and the run is green:
#           `pnpm install --frozen-lockfile` cannot run without a lockfile, which is the case while
#           `@stackra/*` is unpublished.
# Runtime: node
# Governing contract: Stackra ADR 0013 (versioning and release), Stackra ADR 0019 (supply-chain
#                     hardening), Stackra ADR 0177 (npm distribution), Stackra ADR 0453 (the
#                     registry, decisions 6 and 7). Runbook:
#                     https://docs.stackra.figentra.com/runbooks/release
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run `pnpm -r publish --dry-run` (no version PR, no publish) in the release environment"
        type: boolean
        default: false

# One release run per ref at a time: a second run starting before this one finishes would version the
# same changesets twice.
concurrency: release-${{ github.ref }}

# Stackra ADR 0019: nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  # Decides whether a release can run at all. hashFiles() is not available in a job-level `if`, so
  # this job checks out the lockfile alone and exposes the answer as an output the jobs below read.
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      has-lockfile: ${{ steps.lockfile.outputs.present }}
    steps:
      # Stackra ADR 0019: every action is pinned to a full commit SHA, the version in the trailing
      # comment.
      - name: Checkout (lockfile only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - name: Lockfile present
        id: lockfile
        run: |
          present=false
          if [ -f pnpm-lock.yaml ]; then present=true; fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
          if [ "$present" = false ]; then
            echo "::notice::No pnpm-lock.yaml committed yet; release and SBOM are skipped."
          fi

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: preflight
    # No lockfile, no install: skip instead of failing (see the header).
    if: needs.preflight.outputs.has-lockfile == 'true'
    # https://docs.stackra.figentra.com/runbooks/release ("Before the first release"): a human
    # configures this environment as protected and restricted to main, so a branch that edits the
    # workflow cannot obtain a credential.
    environment: release
    permissions:
      contents: write # push the version-PR branch and the version tags
      pull-requests: write # open and update the version PR
      id-token: write # the registry's OIDC exchange and the provenance of each tarball
    outputs:
      published: ${{ steps.changesets.outputs.published }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # changesets diffs against history and reads existing tags
          submodules: false

      # Stackra ADR 0027: node and pnpm come from mise.toml.
      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # STA-1393: Turborepo remote cache (turbo.stackra.figentra.com). Exports TURBO_API, TURBO_TOKEN,
      # TURBO_TEAM and TURBO_REMOTE_CACHE_SIGNATURE_KEY from /ci/turbo; skipped when the variable is
      # unset (local cache only).
      - name: Turborepo remote cache (Infisical OIDC)
        if: vars.INFISICAL_TURBO_IDENTITY_ID != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_TURBO_IDENTITY_ID }}
          domain: https://eu.infisical.com
          project-id: dd4724f4-7b9a-46ae-a899-b34af2d626b2 # Stackra's Infisical project, not a secret
          env-slug: prod
          secret-path: /ci/turbo
          export-type: env

      - name: Build
        run: pnpm build

      # ADR 0453 decision 6, as core's runway-npm.yml: no registry token exists. Per package the
      # publish script exchanges the job's GitHub ID token (audience `npm:<registry host>`) at the
      # registry for a short-lived token bound to that one name; `~/.npmrc` names the variable only.
      - name: Registry
        env:
          REGISTRY: https://npm.stackra.figentra.com/
        run: |
          host="${REGISTRY#https://}"
          # shellcheck disable=SC2016 # the literal ${NODE_AUTH_TOKEN} is the point
          printf '//%s:_authToken=${NODE_AUTH_TOKEN}\n' "$host" >> ~/.npmrc
          cat > "$RUNNER_TEMP/registry-publish.sh" <<'SH'
          set -euo pipefail
          REGISTRY=https://npm.stackra.figentra.com/
          host="${REGISTRY#https://}"
          pnpm -r ls --depth -1 --json |
            jq -r '.[] | select(.private != true) | [.name, .version, .path] | @tsv' |
            while IFS=$'\t' read -r name version dir; do
              encoded="${name/\//%2f}"
              # Versions are immutable (ADR 0453 decision 7): one already there is skipped.
              if curl -fsS -o /dev/null "${REGISTRY}${encoded}/${version}"; then
                echo "skip ${name}@${version}: already on the registry"
                continue
              fi
              id_token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:${host%/}" | jq -r '.value')"
              echo "::add-mask::${id_token}"
              NODE_AUTH_TOKEN="$(curl -fsS -X POST -H "Authorization: Bearer ${id_token}" \
                "${REGISTRY}-/npm/v1/oidc/token/exchange/package/${encoded}" | jq -r '.token')"
              echo "::add-mask::${NODE_AUTH_TOKEN}"
              export NODE_AUTH_TOKEN
              (cd "$dir" && pnpm publish --no-git-checks --provenance --registry "$REGISTRY")
              unset NODE_AUTH_TOKEN
              git tag "${name}@${version}"
              # changesets/action reads this line to push the tag and create the GitHub release.
              echo "New tag: ${name}@${version}"
            done
          SH

      - name: Publish dry run
        if: inputs.dry_run == true
        run: pnpm -r publish --dry-run --no-git-checks --registry https://npm.stackra.figentra.com/

      # With pending changesets this opens or updates the "version packages" PR; when that PR merges,
      # the registry script above publishes every package not marked `"private": true` with
      # provenance. The inputs are changesets/action's own names at this SHA.
      - name: Version PR / publish
        id: changesets
        if: inputs.dry_run != true
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          publish-script: bash ${{ runner.temp }}/registry-publish.sh
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          # GITHUB_TOKEN works, but a PR it opens does not trigger the Quality Gate. Swap in a GitHub App
          # token (actions/create-github-app-token) when the version PR must run the gate.
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # The SBOM of what was just released. It runs only when the release job published something, and
  # holds no write permission: it only reads the repository.
  sbom:
    name: SBOM
    runs-on: ubuntu-24.04
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false

      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm sbom` runs the CycloneDX CLI at its catalog version (catalog `release`). It reads what
      # was installed (node_modules); `--ignore-npm-errors` is needed because it shells out to
      # `npm ls`, which reports the devDependency-only peer graphs of transitive tools as errors even
      # though pnpm installed fine.
      - name: Generate SBOM (CycloneDX)
        run: pnpm sbom

      - name: Upload SBOM as release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
