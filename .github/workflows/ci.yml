# Stackra file contract:
# Purpose: the Quality Gate. Runs on every pull request to main, every merge-queue group commit
#          (merge_group) and every push to main. The main ruleset (.github/rulesets/main.json)
#          requires the `Quality Gate` job by name, so keep that name unchanged.
# Boundary: checks only; nothing here deploys, writes to the repository or holds a secret or an OIDC
#           token (contents: read). Tools come from mise.toml. Until `@stackra/cli` 0.1.0 resolves from
#           the Stackra registry only the install-free pre-release gate runs; from then on the job also
#           installs and runs OSV-Scanner, lint, typecheck, test, build, gen, validate and Squawk, the
#           shape of core's Quality Gate.
# Runtime: node
# Governing contract: Stackra ADR 0019 (supply-chain hardening), Stackra ADR 0027 (toolchain from
#                     mise.toml), Stackra ADR 0174 (OSV), Stackra ADR 0159 (Squawk). Runbook: https://docs.stackra.figentra.com/runbooks/ci
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review re-runs the gate when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue runs the gate on the group commit (the pull request on top of main). The queue
  # itself is off until the ruleset gains a merge_queue rule; the trigger is ready for it.
  merge_group:
    types: [checks_requested]

# A new push to a pull request cancels its superseded run; runs on main and in the merge queue always
# finish, so every commit there has a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Stackra ADR 0019: least privilege. Nothing in the gate writes to the repository or holds an OIDC
# token.
permissions:
  contents: read

jobs:
  gate:
    name: Quality Gate
    # Pinned runner image, so an image upgrade is a reviewed change.
    runs-on: ubuntu-24.04
    # A hung download fails the run, not holds it 6 h.
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      # Stackra ADR 0019: every action is pinned to a full commit SHA, the version in the trailing
      # comment.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      # Stackra ADR 0027: node and gitleaks come from mise.toml, not per-tool setup actions.
      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm gitleaks aqua:google/osv-scanner

      # Whether the framework is installable yet: the install-based steps below run only once the
      # `@stackra/cli` version the catalog pins resolves from the registry the .npmrc maps.
      - name: Registry probe
        id: registry
        run: |
          version="$(sed -n 's/^    "@stackra\/cli": //p' pnpm-workspace.yaml)"
          if npm view "@stackra/cli@${version}" version --registry https://npm.stackra.figentra.com/ >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pre-release::@stackra/cli@${version} is not on the registry yet; only the pre-release gate runs"
          fi

      # The checks that need no workspace install (the pull request title and commit messages, format,
      # spelling, config files parse, secrets scan, the repo scripts' tests), through one committed
      # script, the same command a contributor or agent runs locally. It always runs.
      - name: Pre-release gate
        env:
          # Read by the script's commit-message check; empty outside pull requests, where it is
          # skipped. The title arrives through the environment, never interpolated into the script.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/preview-gate.mjs

      # ADR 0174: known vulnerabilities in the lockfile, before anything is installed.
      - name: Dependency scan (OSV-Scanner)
        if: steps.registry.outputs.published == 'true'
        run: osv-scanner scan source --lockfile=pnpm-lock.yaml

      - name: Install dependencies
        if: steps.registry.outputs.published == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.registry.outputs.published == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.registry.outputs.published == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.registry.outputs.published == 'true'
        run: pnpm test

      - name: Build
        if: steps.registry.outputs.published == 'true'
        run: pnpm build

      # .stackra/ is gitignored: gen writes each member's generated tree (the compiled migrations
      # Squawk reads included), then the check fails on a committed manifest or openapi.json that
      # no longer matches the declarations.
      - name: Gen
        if: steps.registry.outputs.published == 'true'
        run: |
          pnpm gen
          pnpm gen:check

      # `stackra validate` (the root and member runways, the structure), then the example drift check.
      - name: Validate repository
        if: steps.registry.outputs.published == 'true'
        run: pnpm validate

      # ADR 0159 d3: Squawk lints the SQL gen compiled into each service's .stackra/migrations, as
      # core's gate does. A file opening with `-- stackra:transactional=false` runs outside a
      # transaction (concurrent indexes); every other file is linted inside one. The excluded rules
      # are house decisions: no IF NOT EXISTS, varchar and char(3) columns, integer counters.
      - name: Migration lint (Squawk)
        if: steps.registry.outputs.published == 'true'
        run: |
          mapfile -t files < <(find . -path ./node_modules -prune -o -path '*/.stackra/migrations/*.up.sql' -print | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice title=Squawk::no compiled migrations (.stackra/migrations); nothing linted"
            exit 0
          fi
          transactional=()
          online=()
          for file in "${files[@]}"; do
            if head -n 1 "$file" | grep -qx -- '-- stackra:transactional=false'; then online+=("$file"); else transactional+=("$file"); fi
          done
          lint() {
            mise exec github:sbdchd/squawk@2.0.0 -- squawk --pg-version=18.0 \
              --exclude=prefer-robust-stmts --exclude=prefer-text-field --exclude=ban-char-field \
              --exclude=prefer-bigint-over-int "$@"
          }
          if [ "${#transactional[@]}" -gt 0 ]; then lint --assume-in-transaction "${transactional[@]}"; fi
          if [ "${#online[@]}" -gt 0 ]; then lint "${online[@]}"; fi
