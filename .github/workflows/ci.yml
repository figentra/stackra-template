# Stackra file contract:
# Purpose: the Quality Gate. Runs on every pull request to main and every push to main; branch
#          protection requires the `Quality Gate` job, so keep that job name unchanged.
# Needs: no secrets and no OIDC token; contents: read only. Tools come from mise.toml (node, gitleaks).
# Owner: the repository maintainers (CODEOWNERS). Runbook: Stackra docs `/runbooks/ci`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# ADR 0019 D2: least privilege. Nothing in the gate writes to the repository or holds an OIDC token.
permissions:
  contents: read

jobs:
  gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    # The preview gate takes under a minute; a hung npx download should fail the run, not hold it 6 h.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # ADR 0019 D1: every action is pinned to a full commit SHA, the version in the trailing comment.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      # ADR 0027 D2: toolchains come from mise.toml (node, pnpm, gitleaks), not per-tool setup actions.
      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node gitleaks

      # Preview gate: the `@stackra/*` packages and the `stackra` CLI are not published yet, so
      # `pnpm install` and `pnpm verify` cannot run here. Until they are, the gate runs every check that
      # needs no workspace install (commit messages, format, config files parse, secrets scan) through
      # one committed script, the same command a contributor or agent runs locally. Replace this step with
      # `pnpm install --frozen-lockfile`, `pnpm exec commitlint …`, `pnpm verify` and `pnpm secrets:scan`
      # once @stackra/cli is released, and delete .github/scripts/preview-gate.mjs.
      - name: Preview gate
        env:
          # Read by the script's commit-message check; empty on push events, where it is skipped.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}
        run: node .github/scripts/preview-gate.mjs

  # Deploy reads each member's runway.yaml and the root runway.yaml (`stackra infra preview` shows the plan). Applying
  # stays a human step until the deploy ADR decides the promotion unit; this job marks where the deploy goes.
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions: {}

    steps:
      - name: Deploy not wired
        run: echo "Deploy is not wired yet. runway.yaml describes it and a human applies it; nothing is deployed."
