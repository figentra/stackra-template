# Stackra file contract:
# Purpose: the Quality Gate. Runs on every pull request to main, every merge-queue group commit
#          (merge_group) and every push to main. The main ruleset (.github/rulesets/main.json)
#          requires the `Quality Gate` job by name, so keep that name unchanged.
# Boundary: checks only; nothing here deploys, writes to the repository or holds a secret or an OIDC
#           token (contents: read). Tools come from mise.toml (node and gitleaks in this job).
# Runtime: node
# Governing contract: Stackra ADR 0019 (supply-chain hardening), Stackra ADR 0027 (toolchain from
#                     mise.toml). Runbook: https://docs.stackra.figentra.com/runbooks/ci
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review re-runs the gate when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue runs the gate on the group commit (the pull request on top of main). The queue
  # itself is off until the ruleset gains a merge_queue rule; the trigger is ready for it.
  merge_group:
    types: [checks_requested]

# A new push to a pull request cancels its superseded run; runs on main and in the merge queue always
# finish, so every commit there has a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Stackra ADR 0019: least privilege. Nothing in the gate writes to the repository or holds an OIDC
# token.
permissions:
  contents: read

jobs:
  gate:
    name: Quality Gate
    # Pinned runner image, so an image upgrade is a reviewed change.
    runs-on: ubuntu-24.04
    # The pre-release gate takes a few minutes; a hung npx download fails the run, not holds it 6 h.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # Stackra ADR 0019: every action is pinned to a full commit SHA, the version in the trailing
      # comment.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      # Stackra ADR 0027: node and gitleaks come from mise.toml, not per-tool setup actions.
      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node gitleaks

      # Pre-release gate: the `@stackra/*` packages and the `stackra` CLI are not published yet, so
      # `pnpm install` and `pnpm verify` cannot run here. Until they are, the gate runs every check that
      # needs no workspace install (the pull request title and commit messages, format, spelling,
      # config files parse, secrets scan) through one committed script, the same command a contributor
      # or agent runs locally. Replace this step with `pnpm install --frozen-lockfile`, the commitlint
      # checks, `pnpm verify`, `pnpm spell` and `pnpm secrets:scan` once @stackra/cli is released, and
      # delete .github/scripts/preview-gate.mjs. The install needs the HeroUI Pro token: copy the
      # "HeroUI Pro token (Infisical OIDC)" and "Drop the HeroUI Pro token" steps of release.yml around
      # it and grant this job `id-token: write`.
      - name: Pre-release gate
        env:
          # Read by the script's commit-message check; empty outside pull requests, where it is
          # skipped. The title arrives through the environment, never interpolated into the script.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/preview-gate.mjs
