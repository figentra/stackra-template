# Stackra file contract:
# Purpose: give the job a read token for the Figentra registry (npm.stackra.figentra.com and,
#          from the STA-1733 move, registry.figentra.com) in the user-level ~/.npmrc, so pnpm,
#          npm and `stackra build` can read @figentra/* (internal) and @stackra-pro/*. pnpm 12
#          ignores tokens in the repository's .npmrc, so its `_authToken=${...}` line alone is not
#          enough; both token names also go to $GITHUB_ENV for the steps that read that line.
# Boundary: one read-only token, masked, never echoed. It comes from Infisical (project
#           ci-build, prod /ci/registry, FIGENTRA_REGISTRY_TOKEN, or STACKRA_REGISTRY_TOKEN
#           until the owner removes the old name, STA-1733) over GitHub OIDC when the org
#           variables are set, else from the `token` input (the repository secret). Without either
#           it warns and the @figentra reads answer 401. The job needs `id-token: write` for the
#           OIDC route.
# Runtime: GitHub Actions (composite)
# Governing contract: Stackra ADR 0453 (the registry); ADR 0173 (secrets by name only); ADR 0019.
name: Registry auth
description: Write a masked Stackra registry read token to the user-level ~/.npmrc.
inputs:
  token:
    description: >-
      Fallback token (the FIGENTRA_REGISTRY_TOKEN secret, else STACKRA_REGISTRY_TOKEN) when Infisical
      is not configured.
    required: false
    default: ""
  identity-id:
    description: Infisical machine identity for GitHub OIDC (vars.INFISICAL_GATE_IDENTITY_ID).
    required: false
    default: ""
  project-id:
    description: Infisical project holding /ci/registry (vars.INFISICAL_GATE_PROJECT_ID).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Registry token (Infisical OIDC)
      if: inputs.identity-id != '' && inputs.project-id != ''
      # Until the token is placed at /ci/registry, the lookup fails; the next step then warns.
      continue-on-error: true
      uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
      with:
        method: oidc
        identity-id: ${{ inputs.identity-id }}
        domain: https://eu.infisical.com
        project-id: ${{ inputs.project-id }}
        env-slug: prod
        secret-path: /ci/registry
        export-type: env

    - name: Registry token (user .npmrc)
      shell: bash
      env:
        FALLBACK_TOKEN: ${{ inputs.token }}
      run: |
        # FIGENTRA_REGISTRY_TOKEN is the name from STA-1733; STACKRA_REGISTRY_TOKEN is read until the
        # owner removes it.
        token="${FIGENTRA_REGISTRY_TOKEN:-${STACKRA_REGISTRY_TOKEN:-$FALLBACK_TOKEN}}"
        if [ -z "$token" ]; then
          echo "::warning title=Registry::no read token (Infisical ci-build prod /ci/registry FIGENTRA_REGISTRY_TOKEN or STACKRA_REGISTRY_TOKEN, or either secret); @figentra reads will be refused"
          exit 0
        fi
        echo "::add-mask::$token"
        umask 077
        # Both hosts serve the same registry from the STA-1733 move on; the token goes to no other host.
        printf '//%s/:_authToken=%s\n' npm.stackra.figentra.com "$token" registry.figentra.com "$token" >> "$HOME/.npmrc"
        # A project .npmrc names one of the two variables (${VAR} has no fallback), so both carry it.
        printf 'FIGENTRA_REGISTRY_TOKEN=%s\nSTACKRA_REGISTRY_TOKEN=%s\n' "$token" "$token" >> "$GITHUB_ENV"
