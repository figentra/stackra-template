# Stackra file contract:
# Purpose: give the job a read token for the Stackra registry (npm.stackra.figentra.com) in the
#          user-level ~/.npmrc, so pnpm, npm and `stackra build` can read @figentra/* (internal) and
#          @stackra-pro/*. pnpm 12 ignores tokens in the repository's .npmrc, so the project-level
#          `_authToken=${STACKRA_REGISTRY_TOKEN}` line alone is not enough.
# Boundary: one read-only token, masked, never echoed. It comes only from figentra/secrets' `ci/build/registry` scope
#           (SOPS, Cloud KMS), decrypted in the job by core's pinned secrets-decrypt action over Workload Identity; every
#           figentra repository may read that scope (figentra/infra REGISTRY_READERS). No repository secret is read.
#           Without it the step warns and the @figentra reads answer 401. The job needs `id-token: write`.
# Runtime: GitHub Actions (composite)
# Governing contract: Stackra ADR 0453 (the registry); ADR 0525 (SOPS and Cloud KMS); ADR 0019.
name: Registry auth
description: Write a masked Stackra registry read token to the user-level ~/.npmrc.
runs:
  using: composite
  steps:
    # Pinned to a commit of core, as core's own workflows pin it (stackra#570); sops comes through mise.
    - name: Registry token (sops)
      # A failed decrypt leaves the token unset; the next step then warns.
      continue-on-error: true
      uses: figentra/stackra/.github/actions/secrets-decrypt@c8563c852108bb4759827e132b7e5b82b6ae33f4 # @stackra/runway@0.15.0
      with:
        scope: ci/build/registry
        names: STACKRA_REGISTRY_TOKEN

    - name: Registry token (user .npmrc)
      shell: bash
      run: |
        token="${STACKRA_REGISTRY_TOKEN:-}"
        if [ -z "$token" ]; then
          echo "::warning title=Registry::no read token (figentra/secrets ci/build/registry STACKRA_REGISTRY_TOKEN); @figentra reads will be refused"
          exit 0
        fi
        echo "::add-mask::$token"
        umask 077
        printf '//npm.stackra.figentra.com/:_authToken=%s\n' "$token" >> "$HOME/.npmrc"
