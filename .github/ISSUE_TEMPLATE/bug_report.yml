name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: member
    attributes:
      label: Member
      description: The app, service or package (for example services/commerce).
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `pnpm doctor`. Never paste a secret value; name the secret instead.
