# yaml-language-server: $schema=../../schemas/runway-app.schema.json
# Stackra file contract:
# Purpose: what the docs site needs per environment: the one dev port, written only here.
# Boundary: a minimal member runway. The member is the folder that holds this file, so it does not
#           name itself; Mintlify hosts the built site (connected to `apps/docs/src`), so there is
#           no destination, var or secret here. `stackra dev` reads the port and records it in
#           `.stackra/dev/ports.json`; nothing else in the docs names a port.
# Runtime: node
# Governing contract: ADR 0296 (member runway), ADR 0002 (docs on Mintlify), ADR 0170
$schema: "@stackra/runway/schema/app.json"
version: 3
environments:
  dev:
    # `mint dev` on this port, through `stackra dev`
    port: 3333
