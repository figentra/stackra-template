# generated by stackra gen from src/config/telemetry.config.ts (lighthouse paths, runs, minScores;
# vitals and bundle budgets), src/config/i18n.config.ts (locales), runway.yaml (environments.dev →
# origin through .stackra/dev/ports.json) — do not edit
# Purpose: the performance budget of the site as a failing check (`stackra test --tier e2e` runs
#          lhci after Playwright). URLs are telemetry.config.ts lighthouse.paths × locales on the
#          member's dev origin; the origin is resolved at gen time from ports.json (lane offsets
#          applied), so no port is typed anywhere but runway.yaml.
# Boundary: the seeded `demo-tee` product is the measured product page (orders.demo seed).
# Runtime: node
ci:
  collect:
    startServerCommand: stackra start
    startServerReadyPattern: Ready on
    numberOfRuns: 3
    url:
      # ${origin} = ports.json web.url (runway.yaml environments.dev: localhost:5175 on lane 0)
      - ${origin}/
      - ${origin}/pricing
      - ${origin}/store
      - ${origin}/store/demo-tee
      - ${origin}/ar
      - ${origin}/ar/pricing
      - ${origin}/ar/store
      - ${origin}/ar/store/demo-tee
    settings:
      preset: desktop
  assert:
    assertions:
      categories:performance: ["error", { minScore: 0.9 }]
      categories:accessibility: ["error", { minScore: 1 }]
      categories:seo: ["error", { minScore: 1 }]
      largest-contentful-paint: ["error", { maxNumericValue: 2500 }]
      interaction-to-next-paint: ["error", { maxNumericValue: 200 }]
      cumulative-layout-shift: ["error", { maxNumericValue: 0.1 }]
      # entryKb + routeKb, gzipped
      resource-summary:script:size: ["error", { maxNumericValue: 307200 }]
      hreflang: "error"
      canonical: "error"
      document-title: "error"
      html-has-lang: "error"
  upload:
    target: temporary-public-storage
