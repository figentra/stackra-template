# yaml-language-server: $schema=../../schemas/runway-app.schema.json
# Stackra file contract:
# Purpose: WHAT the public site needs and its values per environment: the dev port and host (the
#          only place a port is written; gen puts it into the generated Vite server, Playwright and
#          Lighthouse configs), domains, the public and server vars of the env class, secret names,
#          Workers knobs and the config values that set its config classes. These are what
#          `wrangler.jsonc` is generated from. The member is the folder that holds this file, so
#          the file does not name it.
# Boundary: identity and build-only facts are stackra.config.ts; behaviour is src/config/*; the
#           Cloudflare account, the zone, the edge rules and placement are the root runway. A value
#           here may override a root default, never the reverse. Validated by
#           `@stackra/runway/schema/app.json`. The health check lives here alone; stackra.config.ts
#           does not repeat it. Config is keyed by config key: `web.<stem>` for the site's own
#           classes, the base's key for an override of a package's config.
# Runtime: node
# Governing contract: ADR 0296 (member runway), ADR 0294 (config keys), ADR 0297 (decision 6:
#                     the signed visitor address), ADR 0175, ADR 0173, ADR 0231 d4
$schema: "@stackra/runway/schema/app.json"
version: 3

# Every @Secret of the env class, by name; the values live in the project's secret store and runway
# syncs them into the Worker on deploy. TURNSTILE_SECRET_KEY: the contact form's captcha check.
# GATEWAY_VISITOR_SIGNING_KEY: the HMAC key of the forwarded visitor address, the same value the
# gateway verifies with (root runway).
secrets: [TURNSTILE_SECRET_KEY, GATEWAY_VISITOR_SIGNING_KEY]

# The deploy gate's check: the Worker answers with the release SHA (ADR 0170 DP24).
health:
  path: /healthz
  expects: sha

# the org is root `providers.sentry.org`; the DSN is a var below
telemetry:
  sentryProject: acme-web

environments:
  dev:
    # the React Router dev server on the Workers runtime; HMR defaults to port + 1
    port: 5175
    host: localhost
    # plain http on localhost; the browser treats localhost as a secure context
    https: false
    # `stackra dev` prints the URL instead of opening a browser
    open: false
    # names are the env class fields; gen checks the VITE_ (public) and STACKRA_ (server) prefixes
    vars:
      # empty disables analytics and error reporting in dev
      VITE_POSTHOG_KEY: ""
      # Cloudflare's published always-pass test site key
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      # STACKRA_API_URL is omitted: gen fills it from the root gateway (lane offsets applied)
      # this member's own dev origin; gen expands host:port so the number is never repeated
      STACKRA_SITE_URL: from-port
      STACKRA_SENTRY_DSN: ""
    # the last config layer: every trace in dev, no analytics
    config:
      web.telemetry:
        traces:
          sampleRate: 1
      analytics:
        driver: none
    # Playwright's base URL derives from port/host; the Worker gets Cloudflare's always-pass test
    # secret, so the contact journey runs without a real captcha
    e2e:
      baseUrl: from-port
      seeds: from-stackra-config
      turnstile: test-keys

  # one deployment per pull request; never indexed (the preview host prefix makes every page
  # `noindex` and robots.txt disallow everything)
  preview:
    domain: "web-pr-${pr}.preview.acme.example"
    vars:
      VITE_POSTHOG_KEY: ""
      VITE_TURNSTILE_SITE_KEY: ref:turnstile.siteKey.preview
      STACKRA_API_URL: "https://api-pr-${pr}.preview.acme.example"
      STACKRA_SITE_URL: "https://web-pr-${pr}.preview.acme.example"
      STACKRA_SENTRY_DSN: ref:sentry.dsn.web
    config:
      web.site:
        previewHostPrefixes: [web-pr-]

  staging:
    domain: staging.acme.example
    # inherited from root `destinations.web`; written here so the reviewer sees where it runs
    destination: cloudflare-workers
    # `ref:` values resolve from the root runway's provider outputs at deploy time
    vars:
      VITE_POSTHOG_KEY: ref:posthog.key.web
      VITE_TURNSTILE_SITE_KEY: ref:turnstile.siteKey.staging
      STACKRA_API_URL: https://api.staging.acme.example
      STACKRA_SITE_URL: https://staging.acme.example
      STACKRA_SENTRY_DSN: ref:sentry.dsn.web
    # half of the traces and half of the Worker's requests are sampled
    config:
      web.telemetry:
        traces:
          sampleRate: 0.5
    workers:
      observability:
        headSamplingRate: 0.5

  production:
    domain: www.acme.example
    # hosts that redirect to `domain`
    aliases: [acme.example]
    vars:
      VITE_POSTHOG_KEY: ref:posthog.key.web
      VITE_TURNSTILE_SITE_KEY: ref:turnstile.siteKey.production
      STACKRA_API_URL: https://api.acme.example
      STACKRA_SITE_URL: https://www.acme.example
      STACKRA_SENTRY_DSN: ref:sentry.dsn.web
    # one request in ten is sampled; the SSR Worker gets 50 ms of CPU per request
    workers:
      observability:
        headSamplingRate: 0.1
      limits:
        cpuMs: 50
