# generated by stackra gen from stackra.config.ts (e2e.flows, e2e.profile),
# src/config/i18n.config.ts (locales), src/config/release.config.ts (ios.bundleIdentifier) and
# runway.yaml (release.mobile.profiles.e2e) — do not edit
# Purpose: the Maestro workspace config: which flows run in the gate, in which order, and where the
#          reports go.
# Boundary: the run matrix only; the flows live beside the routes they drive. `stackra test --tier
#           e2e` runs Maestro from the member root with `--config` naming this file and
#           `src/routes/__tests__` (the folder of `e2e.flows`) as the workspace, so the flow glob
#           below resolves inside that folder.
# Runtime: node
# Governing contract: ADR 0182 (test tiers), ADR 0022 (tests beside their subject)
flows:
  - "*.flow.yaml"
includeTags:
  - gate
executionOrder:
  continueOnFailure: false
  # flow `name`s from each flow's header
  flowsOrder:
    - sign-in-and-home
    - create-order
    - offline-queue
# screenshots, logs and the report, under the member root (gitignored)
testOutputDir: maestro-report
# gen runs the whole set once per platform (ios, android from targets) and once per locale (en, ar
# from i18n.config.ts), against the `e2e` EAS profile build of runway.yaml, and passes `--env
# APP_ID=example.acme.mobile` (release.config.ts ios.bundleIdentifier, equal to android.package) and
# `--env MAESTRO_LOCALE=<locale>` to each run.
