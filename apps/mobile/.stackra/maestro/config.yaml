# generated by stackra gen from stackra.config.ts (maestro.flows, e2e.profile, ios.bundleId),
# src/config/i18n.config.ts (locales) and runway.yaml (release.mobile.profiles.e2e) — do not edit
# Purpose: the Maestro workspace config: which flows run in the gate, in which order, and where the
#          reports go.
# Boundary: the run matrix only; the flows live in the `__tests__/` folder of the route they drive.
#           `stackra test --tier e2e` runs Maestro from the member root with `--config` naming this
#           file and `src/routes` (the root of `maestro.flows`) as the workspace, so the flow glob
#           below resolves inside that folder.
# Runtime: node
# Governing contract: ADR 0182 (test tiers), ADR 0022 (tests beside their subject), ADR 0295
#                     (decision 5)
flows:
  - "*/__tests__/*.flow.yaml"
includeTags:
  - gate
executionOrder:
  continueOnFailure: false
  # flow `name`s from each flow's header
  flowsOrder:
    - sign-in-and-home
    - create-order
    - offline-queue
# screenshots, logs and the report, under the member root (gitignored)
testOutputDir: maestro-report
# gen runs the whole set once per platform (ios, android from targets) and once per locale (en,
# en-US, ar, ar-SA from i18n.config.ts), against the `e2e` EAS profile build of runway.yaml, and
# passes `--env APP_ID=example.acme.mobile` (stackra.config.ts ios.bundleId, equal to
# android.package) and `--env MAESTRO_LOCALE=<locale>` to each run.
