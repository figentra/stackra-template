# yaml-language-server: $schema=../../schemas/runway-app.schema.json
# Stackra file contract:
# Purpose: WHAT the mobile app needs per environment: the Metro dev port, the public
#          `EXPO_PUBLIC_*` values gen inlines into the Expo configuration (dev) and runway syncs
#          into the matching EAS environment on deploy, the EAS build profiles and update channels,
#          the Sentry project, and the config values that set its config classes. The member is
#          the folder that holds this file, so the file does not name it.
# Boundary: never WHERE it runs or how it is packed, and never an account: the EAS project, the
#           Apple team, the store ids, the release policy (including the minimum-version gate) and
#           the OTA rollout are the root runway (`providers.expo`, `providers.apple`,
#           `targets.eas`). What the app is lives in stackra.config.ts; how its packages behave in
#           src/config/*. Origins of other members in dev are `from-member` / `from-port`, never a
#           literal port. No secret value ever (Stackra ADR 0173): a native client holds no secret,
#           so there is no `requires` block and the secret list is empty.
# Runtime: node
# Governing contract: Stackra ADR 0296 (member runway), ADR 0295 (decision 4: EAS profiles,
#                     channels, public values and the Sentry project are per member), ADR 0170,
#                     ADR 0173, ADR 0180, ADR 0294 (config keys)
$schema: "@stackra/runway/schema/app.json"
version: 3

# No secret: push, store and CI credentials are EAS-managed or root `secrets.ci` (EXPO_TOKEN, the
# App Store Connect key triple, the Play service account). Names only, never values.
secrets: []

# EAS profiles (channel = profile name; `environment` = the EAS environment runway syncs vars into).
# Gen sets `env.STACKRA_ENVIRONMENT` on each eas.json profile to the runway environment that EAS
# environment is synced from (development → dev), and the generated Expo configuration fails an
# EAS build without it.
release:
  mobile:
    profiles:
      development:
        distribution: internal
        developmentClient: true
        simulator: true
        environment: development
      preview:
        distribution: internal
        androidApk: true
        environment: preview
      staging:
        distribution: store
        autoIncrement: true
        environment: staging
      production:
        distribution: store
        autoIncrement: true
        environment: production
      # stackra.config.ts e2e.profile
      e2e:
        distribution: internal
        simulator: true
        androidApk: true
        environment: preview
    # the release job submits the store profiles to both stores: gen writes eas.json
    # `submit.staging` (TestFlight, Play internal track) and `submit.production` (App Store, Play
    # production track with a staged rollout); root targets.eas.submit names the credentials and the
    # root runway holds the store ids
    submit:
      ios: true
      android: true
    whiteLabel: false # Pro: per-tenant store builds (ADR 0180 d1) take a `variants:` list here

# The Sentry project is per member, not per environment (the organisation is root
# providers.sentry.org).
telemetry:
  sentryProject: acme-mobile

# Environments (names fixed by ADR 0170 d5 as amended: dev | preview | staging | production)
environments:
  dev:
    # Metro; lanes add N*100 per worktree (root environments.dev.lanes). `stackra dev` passes it to
    # Expo CLI as `--port` and gen writes `.stackra/dev/ports.json`.
    port: 8081
    mobile:
      devClient: true
    # EXPO_PUBLIC_* values for a dev client; names are the `@Env` fields of src/config/*, gen checks
    # the prefix
    vars:
      EXPO_PUBLIC_EAS_PROJECT_ID: "" # empty in a bare clone: no EAS update URL, no project binding
      # root environments.dev.infra.gateway; `stackra dev --lan` rewrites to the LAN address
      EXPO_PUBLIC_API_ORIGIN:
        from-port: gateway
      # the console's dev origin, for universal links in dev
      EXPO_PUBLIC_APP_ORIGIN:
        from-member: console
      # served by the dev gateway
      EXPO_PUBLIC_REALTIME_ORIGIN:
        from-port: gateway
        scheme: ws
        path: /realtime
      # the dev ZITADEL container, seeded with this app's PKCE client
      EXPO_PUBLIC_ZITADEL_ISSUER:
        from-port: zitadel
      # the seeded client id (`.stackra/zitadel/seed.yaml`)
      EXPO_PUBLIC_ZITADEL_CLIENT_ID: mobile-dev
      EXPO_PUBLIC_SENTRY_DSN: "" # crash reporting off in dev
      EXPO_PUBLIC_PUSH_PROVIDER: expo
      EXPO_PUBLIC_POSTHOG_KEY: "" # no product analytics in dev
    # the last config layer (ADR 0146), keyed by config key: an override keeps its base's key
    config:
      logger.telemetry:
        errors:
          sampleRate: 1
      analytics:
        driver: none
    # Maestro runs on the simulator or emulator against the dev gateway
    e2e:
      seeds: from-stackra-config

  preview:
    mobile:
      channel: preview
      profile: preview
    vars:
      EXPO_PUBLIC_EAS_PROJECT_ID: ref:expo.projectId
      EXPO_PUBLIC_API_ORIGIN: "https://api-pr-${pr}.preview.acme.example"
      EXPO_PUBLIC_REALTIME_ORIGIN: "wss://api-pr-${pr}.preview.acme.example/realtime"
      EXPO_PUBLIC_APP_ORIGIN: "https://console-pr-${pr}.preview.acme.example"
      EXPO_PUBLIC_ZITADEL_ISSUER: ref:zitadel.issuer.nonprod
      EXPO_PUBLIC_ZITADEL_CLIENT_ID: ref:zitadel.clients.mobile.nonprod
      EXPO_PUBLIC_SENTRY_DSN: ref:sentry.dsn.mobile
      EXPO_PUBLIC_PUSH_PROVIDER: expo
      EXPO_PUBLIC_POSTHOG_KEY: ref:posthog.key.mobile

  staging:
    # inherits root environments.staging.mobile.channel; shown for completeness
    mobile:
      channel: staging
      profile: staging
    vars:
      EXPO_PUBLIC_EAS_PROJECT_ID: ref:expo.projectId
      EXPO_PUBLIC_API_ORIGIN: https://api.staging.acme.example
      EXPO_PUBLIC_REALTIME_ORIGIN: wss://api.staging.acme.example/realtime
      EXPO_PUBLIC_APP_ORIGIN: https://console.staging.acme.example
      EXPO_PUBLIC_ZITADEL_ISSUER: ref:zitadel.issuer.nonprod
      EXPO_PUBLIC_ZITADEL_CLIENT_ID: ref:zitadel.clients.mobile.nonprod
      EXPO_PUBLIC_SENTRY_DSN: ref:sentry.dsn.mobile
      EXPO_PUBLIC_PUSH_PROVIDER: expo
      EXPO_PUBLIC_POSTHOG_KEY: ref:posthog.key.mobile
    config:
      logger.telemetry:
        errors:
          sampleRate: 1
        traces:
          sampleRate: 0.5

  production:
    mobile:
      channel: production
      profile: production
    vars:
      EXPO_PUBLIC_EAS_PROJECT_ID: ref:expo.projectId
      EXPO_PUBLIC_API_ORIGIN: https://api.acme.example
      EXPO_PUBLIC_REALTIME_ORIGIN: wss://api.acme.example/realtime
      EXPO_PUBLIC_APP_ORIGIN: https://console.acme.example
      EXPO_PUBLIC_ZITADEL_ISSUER: ref:zitadel.issuer.prod
      EXPO_PUBLIC_ZITADEL_CLIENT_ID: ref:zitadel.clients.mobile.prod
      EXPO_PUBLIC_SENTRY_DSN: ref:sentry.dsn.mobile
      EXPO_PUBLIC_PUSH_PROVIDER: expo
      EXPO_PUBLIC_POSTHOG_KEY: ref:posthog.key.mobile
    config:
      logger.telemetry:
        errors:
          sampleRate: 0.5
        traces:
          sampleRate: 0.1
