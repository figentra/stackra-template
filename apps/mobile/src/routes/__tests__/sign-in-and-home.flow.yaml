# Stackra file contract:
# Purpose: the hosted sign-in round trip (the e2e identity stub answers the PKCE redirect), then the
#          tab bar and the home page are visible. The e2e test login is the demo customer, the
#          loyalty kit's `DemoSeeder.ids.bronze` (1 000 demo points from `loyalty_kit.demo`). Other
#          flows `runFlow` this one first.
# Boundary: one journey; no assertions about internals. `stackra test` passes `MAESTRO_LOCALE`
#           (each locale of i18n.config.ts) and `APP_ID` (release.config.ts ios.bundleIdentifier)
#           with `--env`; `name` is the key of the workspace config's `flowsOrder`.
# Runtime: node
# Governing contract: ADR 0182, ADR 0206, ADR 0022
appId: ${APP_ID}
name: sign-in-and-home
tags: [gate]
---
- launchApp:
    clearState: true
    arguments: { locale: "${MAESTRO_LOCALE}" }
- assertVisible: { id: "sign-in-page" }
- tapOn: { id: "sign-in-button" }
- assertVisible: { id: "home-page", timeout: 15000 }
- assertVisible: { id: "tab-orders" }
