# yaml-language-server: $schema=https://static.stackra.figentra.com/schemas/runway/app.json
# Stackra file contract:
# Purpose: WHAT the console needs per environment: the one dev port (written only here). The member is the folder
#          that holds this file, so it does not name itself.
# Boundary: a member runway. WHERE the console runs and its hosts are the root runway's (`environments.<env>.domains`
#           and destinations); no secret: everything the browser receives is public.
# Runtime: browser
# Governing contract: ADR 0296 (member runway); ADR 0515 (decision 6: the minimal profile's app member)
$schema: "@stackra/runway/schema/app.json"
version: 3
environments:
  dev:
    # `stackra dev` serves the console on this port; the scaffold's range for a console is 3710-3799.
    port: 3710
