# generated by stackra gen from stackra.config.ts (name, electron), src/config/desktop.config.ts
# (deepLinks), src/config/theming.config.ts (logo), the drivers src/config/peripherals.config.ts
# picks (entitlements), runway.yaml (release.desktop: feedPath, platforms, signing switches;
# environments.production.desktop.channel) and root runway.yaml (targets.electron-release: feed
# origin) — do not edit
# Purpose: electron-builder settings of the desktop target: identity, the files packed, the
#          entry main runs, installers per platform, the macOS entitlements and the update feed.
# Boundary: no signing identity, password or APPLE_* value: `signing` is off in the member runway
#           (ADR 0254 d1); when on, gen emits the key names and the release workflow supplies values
#           from Infisical /ci. Fuses are `fuses.json`, set by the afterPack hook @stackra/platform
#           ships (ADR 0251).
# Runtime: node
# Governing contract: ADR 0295 (decisions 3 to 5), ADR 0249, ADR 0251, ADR 0254

# stackra.config.ts electron.appId: the bundle identifier, stable across releases
appId: example.acme.console
# stackra.config.ts name: the dock, start-menu and installer name
productName: Acme Console
# stackra.config.ts electron.copyright
copyright: Copyright © 2026 Acme
# the package.json fields the packed app sees; `main` points Electron at the main bundle built
# from .stackra/entry/electron.ts, not at the member's source package.json
extraMetadata:
  main: dist/desktop/main.js
directories:
  # installers and blockmaps land here; the release workflow uploads this folder
  output: dist/desktop-release
# the renderer bundle (app://bundle/) and the main and preload bundles; nothing else is packed
files:
  - dist/renderer/**
  - dist/desktop/**
# desktop.config.ts deepLinks.scheme, registered as the default handler at install
protocols:
  - name: Acme Console
    schemes: [acme-console]
# applies fuses.json to the packed binary before signing
afterPack: "@stackra/platform/electron/after-pack"
mac:
  icon: dist/icons/icon.icns
  # required for notarisation; the entitlements below are what the hardened runtime allows
  hardenedRuntime: true
  # generated from the baseline (JIT for V8) plus the entitlements the drivers in use need (USB for
  # the receipt printer and scanner, ADR 0253); helpers inherit the same set
  entitlements: .stackra/desktop/entitlements.mac.plist
  entitlementsInherit: .stackra/desktop/entitlements.mac.plist
  # runway release.desktop.platforms.mac ∩ stackra.config.ts electron.mac; `zip` feeds the updater
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
win:
  icon: dist/icons/icon.ico
  # runway release.desktop.platforms.windows ∩ stackra.config.ts electron.win
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  # stackra.config.ts electron.nsis.perMachine: a per-user install that needs no administrator
  perMachine: false
linux:
  icon: dist/icons/icon-512.png
  # stackra.config.ts electron.linux: AppImage only on day one (ADR 0254 d2)
  target:
    - target: AppImage
      arch: [x64]
publish:
  # a static feed electron-updater reads; no provider account is involved
  provider: generic
  # root targets.electron-release.feed.publicOrigin + runway release.desktop.feedPath
  url: https://downloads.acme.example/console/${channel}/
  # runway environments.production.desktop.channel; staging builds carry `beta`
  channel: latest
