# generated by stackra gen from src/config/desktop.config.ts (packaging, deepLinks, updates),
# src/config/theming.config.ts (logo), runway.yaml (release.desktop: feedPath, platforms, signing
# switches; environments.production.desktop.channel) and root runway.yaml
# (targets.electron-release: feed origin) — do not edit
# Purpose: electron-builder settings of the desktop target.
# Boundary: no signing identity, password or APPLE_* value: `signing` is off in the member runway
#           (ADR 0254 d1); when on, gen emits the key names and the release workflow supplies values
#           from Infisical /ci. Fuses are `fuses.json`, set by the afterPack hook @stackra/platform
#           ships (ADR 0251).
# Runtime: node
appId: com.figentra.console
productName: Console
copyright: © Figentra
directories:
  output: dist/desktop-release
files:
  - dist/renderer/**
  - dist/desktop/**
protocols:
  - name: Figentra Console
    schemes: [figentra-console]
afterPack: "@stackra/platform/electron/after-pack" # applies fuses.json
mac:
  icon: dist/icons/icon.icns
  hardenedRuntime: true
  # baseline + com.apple.security.device.usb (desktop.config.ts)
  entitlementsInherit: "@stackra/platform/electron/entitlements.plist"
  target: [dmg, zip] # runway release.desktop.platforms.mac ∩ desktop.config.ts packaging.mac
  arch: [universal]
win:
  icon: dist/icons/icon.ico
  target: [nsis]
  arch: [x64, arm64]
nsis:
  perMachine: false
linux:
  icon: dist/icons/icon-512.png
  target: [AppImage]
publish:
  provider: generic
  # root targets.electron-release.feed.publicOrigin + runway release.desktop.feedPath
  url: https://downloads.figentra.com/console/${channel}/
  channel: latest # runway environments.production.desktop.channel; staging builds carry `beta`
