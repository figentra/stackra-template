<!doctype html>
<!--
generated by stackra gen from stackra.config.ts (targets), src/config/theming.config.ts,
src/config/i18n.config.ts, src/config/env.config.ts (API and realtime origins, per environment),
assets/lang/{en,ar}/console.json (manifest.name, manifest.short_name, manifest.description),
.stackra/pwa/icons.ts and src/styles/app.css — do not edit
Purpose: the console's single HTML page for the web, PWA and desktop targets; Vite injects the
         module script and the stylesheet.
Boundary: a mount point only; no inline script or style (the CSP forbids them). `lang`, `dir`, the
          title, the description and the manifest link are the default locale's for the first
          paint; the i18n module rewrites all of them at boot. The manifest link and the
          installed-app metas are emitted for the pwa target only; the console is never indexed.
          The entry is the generated `.stackra/entry/browser.ts`.
Runtime: browser
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Acme Console</title>
    <meta
      name="description"
      content="Orders, catalogue and stock for your store, online or offline."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1e22" />
    <link rel="preconnect" href="https://api.acme.example" crossorigin />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" sizes="180x180" />
    <!-- pwa target only: -->
    <link rel="manifest" href="/manifest.en.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Console" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <noscript>
      <p lang="en">Acme Console needs JavaScript. Turn it on and reload the page.</p>
      <p lang="ar" dir="rtl">تحتاج وحدة تحكم Acme إلى JavaScript. فعّله ثم أعد تحميل الصفحة.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/.stackra/entry/browser.ts"></script>
  </body>
</html>
