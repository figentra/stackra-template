<!doctype html>
<!--
generated by stackra gen from stackra.config.ts (targets), src/config/theming.config.ts (theme
`acme`, logo, fonts), src/config/i18n.config.ts (en-US, ltr, prefix `/en-us`),
src/config/env.config.ts (API and realtime origins, per environment),
assets/lang/{en-US,en}/manifest.json (name, short_name, description), .stackra/pwa/icons.ts and
src/styles/app.css — do not edit
Purpose: the console's HTML page for the en-US locale (/en-us…) on the web, PWA and desktop
         targets; Vite injects the module script and the stylesheet. Gen writes one page per locale
         from the same source: ./index.html (en), ./en-us/, ./ar/ and ./ar-sa/.
Boundary: a mount point only; no inline script or style (the CSP forbids them). `lang`, `dir`, the
          title, the description and the manifest link are this locale's, so the first paint and an
          install both use the right language; the i18n module keeps them in step when the user
          switches locale. The manifest link and the installed-app meta tags are emitted for the pwa
          target only; the console is never indexed. `theme-color` is the theme's `background`
          per scheme. The entry is the generated `.stackra/entry/browser.ts`.
Runtime: browser
-->
<html lang="en-US" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Acme Console</title>
    <meta
      name="description"
      content="Orders, catalog and stock for your store, online or offline."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f8f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1216" />
    <link rel="preconnect" href="https://api.acme.example" crossorigin />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" sizes="180x180" />
    <!-- theming.config.ts selfHostedFonts: the faces the first paint uses -->
    <link rel="preload" href="/fonts/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- pwa target only: -->
    <link rel="manifest" href="/manifest.en-us.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Console" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <noscript>
      <p>Acme Console needs JavaScript. Turn it on and reload the page.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/.stackra/entry/browser.ts"></script>
  </body>
</html>
