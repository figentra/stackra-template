# yaml-language-server: $schema=https://json.schemastore.org/pnpm-workspace.json
# Stackra file contract:
# Purpose: workspace members, the only source of versions (catalogs) and the install policy. Every
#          version any member references is pinned here; a member's package.json names a catalog
#          (`catalog:<name>`) or `workspace:*`, never a literal version.
# Boundary: versions and install policy only; no scripts and no secret. Exact pins, no ranges.
#           Workspace members (@acme/loyalty-kit, @acme/access-log, @acme/brand and the
#           packages/tooling presets) are `workspace:*`, never catalog entries.
# Runtime: node
# Governing contract: Stackra ADR 0013 (versions come only from catalogs and workspace references),
#                     Stackra ADR 0019 (supply-chain hardening), Stackra ADR 0294 (decisions 23 and
#                     26: package names, the zod pin)
packages:
  - apps/*
  - packages/*/*
  - services/*

# `strict`: `pnpm add` only accepts a version that already exists in a catalog. A new dependency is
# added here first, then referenced by the member.
catalogMode: strict

# Refuse an unsupported Node (engines in package.json).
engineStrict: true

# Supply chain (Stackra ADR 0019): a version must be at least one day old before pnpm resolves it, so
# a compromised release has time to be pulled; a dependency that loses its trusted-publisher
# provenance between versions fails the install instead of downgrading silently.
minimumReleaseAge: 1440
trustPolicy: no-downgrade

catalogs:
  # Stackra framework packages, one version line for the whole framework. Bumped together.
  stackra:
    "@stackra/actions": 1.0.0
    "@stackra/ai": 1.0.0
    "@stackra/analytics": 1.0.0
    "@stackra/app": 1.0.0
    "@stackra/assets": 1.0.0
    "@stackra/cache": 1.0.0
    "@stackra/cli": 1.0.0
    "@stackra/clients": 1.0.0
    "@stackra/config": 1.0.0
    "@stackra/connections": 1.0.0
    "@stackra/consent": 1.0.0
    "@stackra/container": 1.0.0
    "@stackra/content": 1.0.0
    "@stackra/contracts": 1.0.0
    "@stackra/coordinator": 1.0.0
    "@stackra/csp": 1.0.0
    "@stackra/database": 1.0.0
    "@stackra/entitlements": 1.0.0
    "@stackra/errors": 1.0.0
    "@stackra/events": 1.0.0
    "@stackra/experience": 1.0.0
    "@stackra/feature-flags": 1.0.0
    "@stackra/filesystem": 1.0.0
    "@stackra/gen": 1.0.0
    "@stackra/i18n": 1.0.0
    "@stackra/iam": 1.0.0
    "@stackra/identity": 1.0.0
    "@stackra/integrations": 1.0.0
    "@stackra/ledger": 1.0.0
    "@stackra/locking": 1.0.0
    "@stackra/logger": 1.0.0
    "@stackra/media": 1.0.0
    "@stackra/model": 1.0.0
    "@stackra/money": 1.0.0
    "@stackra/navigation": 1.0.0
    "@stackra/notifications": 1.0.0
    "@stackra/outbox": 1.0.0
    "@stackra/panel": 1.0.0
    "@stackra/peripherals": 1.0.0
    "@stackra/platform": 1.0.0
    "@stackra/query": 1.0.0
    "@stackra/queue": 1.0.0
    "@stackra/realtime": 1.0.0
    "@stackra/runway": 1.0.0
    "@stackra/scheduler": 1.0.0
    "@stackra/search": 1.0.0
    "@stackra/seo": 1.0.0
    "@stackra/settings": 1.0.0
    "@stackra/shortcuts": 1.0.0
    "@stackra/state": 1.0.0
    "@stackra/state-machine": 1.0.0
    "@stackra/storage": 1.0.0
    "@stackra/support": 1.0.0
    "@stackra/tenancy": 1.0.0
    "@stackra/testing": 1.0.0
    "@stackra/theming": 1.0.0
    "@stackra/transport": 1.0.0
    "@stackra/ui": 1.0.0
    "@stackra/validation": 1.0.0
    "@stackra/versioning": 1.0.0
    "@stackra/vite-plugin": 1.0.0
    "@stackra/webhooks": 1.0.0
    "@stackra/workflow": 1.0.0
    "@stackra-pro/ui": 1.0.0
  # Shared by web, desktop and mobile members (`catalog:`). react and react-dom stay on the exact
  # renderer version react-native 0.86 (Expo SDK 57) ships with, so every member and every package
  # with a React entry resolves one React.
  default:
    react: 19.2.3
    react-dom: 19.2.3
    react-router: 7.9.4
    resend: 6.1.2
    isbot: 5.1.31
    "@react-email/components": 0.5.2
    # Node 24 is the runtime (mise.toml, .node-version); the types follow its major.
    "@types/node": 24.19.2
    # React's types follow the React 19.2 line above, for web, desktop and mobile alike.
    "@types/react": 19.2.18
    "@types/react-dom": 19.2.7
    # The schemas `stackra gen` compiles from shape classes import zod, so every member that authors
    # shapes depends on it; authored code never imports it, except through the `@Field(zod)` hatch.
    # 4.1 or later is needed for codecs and `.exactOptional()` (Stackra ADR 0294 decision 26).
    zod: 4.6.7
  # HeroUI's design-system stylesheet (web and desktop).
  ui:
    "@heroui/styles": 3.2.6
  # Web and PWA build-time styling and the service-worker runtime (Workbox).
  frontend:
    tailwindcss: 4.3.3
    workbox-expiration: 7.3.0
    workbox-navigation-preload: 7.3.0
    workbox-precaching: 7.3.0
    workbox-routing: 7.3.0
    workbox-strategies: 7.3.0
  # Expo SDK 57 (apps/mobile). Expo-owned packages are pinned to the versions expo 57.0.31 bundles
  # (`expo install --check` reports any drift); bump them together, in one change, with
  # `expo install --fix`. React Navigation and the native tab bar are code-based navigation (no
  # expo-router, Stackra ADR 0227). heroui-native's peers (expo-blur, @gorhom/bottom-sheet,
  # tailwind-merge, tailwind-variants) are pinned beside it.
  mobile:
    expo: 57.0.31
    react-native: 0.86.3
    "@react-navigation/native": 7.5.1
    "@react-navigation/native-stack": 7.21.0
    react-native-bottom-tabs: 1.4.0
    "@bottom-tabs/react-navigation": 1.4.0
    react-native-screens: 4.26.2
    react-native-safe-area-context: 5.7.0
    heroui-native: 1.0.10
    uniwind: 1.12.1
    "@gorhom/bottom-sheet": 5.2.14
    tailwind-merge: 3.7.0
    tailwind-variants: 3.3.1
    react-native-reanimated: 4.5.1
    react-native-gesture-handler: 2.32.0
    react-native-worklets: 0.10.1
    react-native-svg: 15.15.4
    # react-native-mmkv 3.x: TurboModule build; 4.x moves to Nitro modules (another native dependency).
    react-native-mmkv: 3.3.3
    expo-auth-session: 57.0.16
    expo-blur: 57.0.3
    expo-camera: 57.0.6
    expo-constants: 57.0.22
    expo-crypto: 57.0.4
    expo-dev-client: 57.0.20
    expo-device: 57.0.2
    expo-glass-effect: 57.0.4
    expo-linking: 57.0.13
    expo-network: 57.0.3
    expo-notifications: 57.0.23
    expo-secure-store: 57.0.4
    expo-splash-screen: 57.0.10
    expo-sqlite: 57.0.4
    expo-status-bar: 57.0.1
    expo-updates: 57.0.26
    expo-web-browser: 57.0.3
    "@sentry/react-native": 7.11.0
  # Toolchain that compiles and bundles: TypeScript, Turborepo, Vite, tsdown, Electron and the
  # React Router build plugin. The presets in packages/tooling are written against these pins.
  build:
    turbo: 2.11.9
    typescript: 7.0.2
    vite: 7.1.10
    tsdown: 0.23.1
    electron: 38.2.0
    "@react-router/dev": 7.9.4
  # Format, lint, spelling and test tools every member's scripts run.
  quality:
    vitest: 5.0.5
    "@vitest/coverage-v8": 5.0.5
    jsdom: 30.1.0
    knip: 6.41.0
    "@playwright/test": 1.56.1
    oxlint: 1.86.0
    oxfmt: 0.71.0
    cspell: 10.4.0
    "@lhci/cli": 0.15.1
  # Release tooling: changesets, commitlint, git hooks and the release SBOM (CycloneDX).
  release:
    "@changesets/cli": 3.0.3
    "@changesets/changelog-git": 1.0.0
    "@commitlint/cli": 21.2.3
    "@commitlint/config-conventional": 21.2.3
    lefthook: 2.2.2
    "@cyclonedx/cyclonedx-npm": 6.0.1
  # The Mintlify CLI that builds and previews apps/docs.
  docs:
    mint: 4.2.1095

# @react-router/dev 7.9.4 declares `typescript: ^5.1.0` as a peer, while the workspace compiles with
# TypeScript 7 (catalog `build`). The plugin only reads tsconfig paths and runs typegen, which TypeScript
# 7 serves; check apps/web typegen whenever either version moves, and drop this entry once the peer
# range includes 7.
peerDependencyRules:
  allowedVersions:
    "@react-router/dev>typescript": "7"

# Dependency lifecycle scripts are blocked by default (pnpm supply-chain security). Every entry here was
# reviewed; a new one must be, too. Install fails (ERR_PNPM_IGNORED_BUILDS) until it is.
allowBuilds:
  # Native binary for the Vite and tsdown transforms.
  esbuild: true
  # Installs the git hooks from lefthook.yml on `pnpm install` (skipped when CI is set).
  lefthook: true
  # Native image library behind icon and splash generation.
  sharp: true
  # Downloads the Electron binary the desktop target runs and packages.
  electron: true
  # Downloads the Sentry CLI that uploads native and JavaScript source maps (pulled in by
  # @sentry/react-native).
  "@sentry/cli": true
