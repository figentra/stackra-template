# Stackra file contract:
# Purpose: workspace members and the only source of versions (catalogs). Every version referenced by
#          any member is here.
# Boundary: versions only; no scripts. Exact pins, no ranges (versions rule). Workspace members
#           (@stackra/loyalty-kit, @stackra/access-log, @stackra/brand and the packages/tooling
#           presets) are `workspace:*`, never catalog entries.
# Runtime: node
# Governing contract: ADR 0013 (versions come only from catalogs and workspace references)
packages:
  - apps/*
  - packages/*/*
  - services/*
catalogMode: strict
# Refuse an unsupported Node (engines).
engineStrict: true
catalogs:
  stackra:
