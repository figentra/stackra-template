# Stackra file contract:
# Purpose: the starter profile file `stackra create` reads from the published @stackra/starter (ADR 0515
#          decision 5): the names it rewrites and, per profile, which tracked files it writes. `minimal` (the
#          default) is the standalone app that belongs to whoever creates it (STA-2877): the web console, one service
#          with one module, the root toolchain and one Quality Gate workflow, with none of Figentra's own setup.
#          `internal` (opt in) is the same app with Figentra's setup kept: Figentra Flow, code owners, every workflow,
#          the agent hooks and the full MCP list. `full` is this whole template, the Figentra product shape with that
#          setup (surfaces in runway.yaml, no app member, ADR 0515 decision 6). Each carries a root runway.yaml Runway
#          reads the same way.
# Boundary: data only; `create` implements it. It writes only the git-tracked files a profile's `include` globs
#           match (POSIX globs from the repository root, Node `path.matchesGlob` semantics on paths whose segments'
#           leading dots are dropped, so `*` also matches a dot file and `!(…)` excludes), then copies each `overlay`
#           source over its target path, applies `rename` to every text file, drops this file, pnpm-lock.yaml and
#           starter/, pins catalog `stackra` to the CLI's own version and installs fresh. Every overlay source lives
#           under `starter/minimal/`; `node .github/scripts/starter-overlays.mjs` derives six of them from their root
#           file, and its test refuses Figentra's furniture (its FURNITURE list) in the minimal profile.
# Runtime: node
# Governing contract: Stackra ADR 0515 (decisions 3, 5 and 6); ADR 0349 (product package names); ADR 0441
#                     (the product shape, kept by `full`); STA-2877 (the outside default and the internal profile).
version: 1

# Ordered literal replacements, most specific first, applied to every text file `create` writes. Placeholders:
# {name} the app's package name (kebab), {scope} its npm scope ("@kebab"), {key} the product key ({name} without
# the characters outside [a-z0-9]). The last rule turns every remaining `acme` (the runway product key, hosts,
# bundle ids, organisations, the cspell word) into the key, so no placeholder value is left behind. Display text
# ("Acme") is prose and stays.
rename:
  # Member packages: @figentra/acme-service-example, @figentra/acme-console, @figentra/acme-example.
  - from: "@figentra/acme-"
    to: "{scope}/"
  # The docs app (@acme/docs, and the root `docs` script's filter) and GitHub team handles.
  - from: "@acme/"
    to: "{scope}/"
  # The root package, runway `project`, the Encore app, the repository and the Helm namespace.
  - from: acme-platform
    to: "{name}"
  # runway `product.key` and every name derived from it.
  - from: acme
    to: "{key}"

profiles:
  # The default: an app that belongs to whoever creates it. Each root file and tooling path is named, so a new one
  # is a choice and not an accident; Figentra's furniture (Flow, code owners, the deploy, release and Flow workflows,
  # the registry-token action, the agent hooks, the OpenCode setup) is left out, and the root files that carry
  # Figentra's setup come from starter/minimal/ instead.
  minimal:
    include:
      # The root toolchain.
      - ".changeset/**"
      - ".commitlintrc.yaml"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - ".gitleaks.toml"
      - ".markdownlint.yaml"
      - ".node-version"
      - ".oxfmtrc.jsonc"
      - ".oxlintrc.jsonc"
      - ".vscode/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE"
      - "NOTICE"
      - "SECURITY.md"
      - "cspell.config.yaml"
      - "knip.jsonc"
      - "mise.toml"
      - "osv-scanner.toml"
      - "renovate.json5"
      - "stackra.lock.yaml"
      - "turbo.jsonc"
      # The agent tree without the Flow guard hooks and the Flow skills.
      - ".agents/agents/**"
      - ".agents/models.yaml"
      - ".agents/reference/**"
      - ".agents/routing.yaml"
      - ".agents/rules/**"
      - ".agents/skills/!(flow-*)/**"
      - ".claude/launch.json"
      # GitHub: the issue forms, the pull request template, the main ruleset and the Quality Gate's scripts.
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/rulesets/**"
      - ".github/scripts/example-drift.mjs"
      - ".github/scripts/preview-gate.mjs"
      - ".github/scripts/__tests__/example-drift.test.mjs"
      - "docs/**"
      # The web console and the one service with its notes module.
      - "apps/README.md"
      - "apps/console/**"
      - "services/**"
      - "services/**/.*"
      # The brand and language sources; no mobile, store or landing assets.
      - "assets/.gitkeep"
      - "assets/README.md"
      - "assets/brand/**"
      - "assets/brand/.gitkeep"
      - "assets/lang/**"
      - "assets/lang/.gitkeep"
    overlay:
      # No surfaces, mobile app or docs site; the console's `web` destinations instead.
      runway.yaml: starter/minimal/root-runway.yaml
      # Written for the app, not for this template.
      README.md: starter/minimal/README.md
      CONTRIBUTING.md: starter/minimal/CONTRIBUTING.md
      llms.txt: starter/minimal/llms.txt
      # The Stackra scopes only; no Figentra scope.
      .npmrc: starter/minimal/.npmrc
      # Derived from the root files by .github/scripts/starter-overlays.mjs.
      package.json: starter/minimal/package.json
      pnpm-workspace.yaml: starter/minimal/pnpm-workspace.yaml
      .mcp.yaml: starter/minimal/.mcp.yaml
      .claude/settings.json: starter/minimal/.claude/settings.json
      lefthook.yml: starter/minimal/lefthook.yml
      .github/workflows/ci.yml: starter/minimal/.github/workflows/ci.yml
  # Opt in (`stackra create --profile internal`): the minimal app with Figentra's own setup kept, for an app
  # Figentra builds and runs itself.
  internal:
    include:
      # The root files and the repository tooling.
      - "*"
      - ".*"
      - ".agents/**"
      - ".changeset/**"
      - ".claude/**"
      - ".flow/**"
      - ".github/**"
      - ".vscode/**"
      - "docs/**"
      # The web console and the one service with its notes module.
      - "apps/README.md"
      - "apps/console/**"
      - "services/**"
      - "services/**/.*"
      # The brand and language sources; no mobile, store or landing assets.
      - "assets/.gitkeep"
      - "assets/README.md"
      - "assets/brand/**"
      - "assets/brand/.gitkeep"
      - "assets/lang/**"
      - "assets/lang/.gitkeep"
    overlay:
      # No surfaces, mobile app or docs site; the console's `web` destinations instead.
      runway.yaml: starter/minimal/root-runway.yaml
  full:
    # Everything tracked except the minimal profile's console (ADR 0515 decision 6: no app member here), with
    # Figentra's setup, as `internal`.
    include:
      - "*"
      - ".*"
      - ".*/**"
      - "apps/README.md"
      - "apps/docs/**"
      - "assets/**"
      - "assets/**/.*"
      - "docs/**"
      - "packages/**"
      - "packages/**/.*"
      - "services/**"
      - "services/**/.*"
